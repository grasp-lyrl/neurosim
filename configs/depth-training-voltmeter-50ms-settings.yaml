# Simulator settings for depth training: an event camera + a depth camera on a crazyflie
# flying random min-snap paths indoors, 50 ms event context (20 Hz depth anchor).
#
# This is the *simulator*, and nothing else -- the same schema test_sim.py and the offline
# recorder read. A training config names it as `base_settings` and brings the other half:
# which scenes, what to randomize per episode, how many producers, and the batch layout.
# Check a trajectory against it with:
#   python scripts/check_trajectories.py --config configs/depth-training-voltmeter-50ms-settings.yaml --seed 0
simulator:
  world_rate: 1000 # Hz
  control_rate: 100 # Hz
  sim_time: 30.0 # seconds per episode
  coord_transform: "rotorpy_to_hm3d"

  sensor_rates:
    event_camera_1: 1000 # Hz - high-frequency event accumulation
    depth_camera_1: 20 # Hz - anchor rate, and so a 50 ms event window

visual_backend:
  gpu_id: 0 # overridden per-producer by online_data.gpu_ids
  scene: "" # bootstrapped from randomization.scenes_glob[0]; DR picks a scene per episode
  scene_dataset_config_file: "default"
  clear_color: [0.0, 0.0, 0.0, 1.0]
  default_agent: 0
  agent_height: 1.0
  agent_radius: 0.3
  # Habitat never evicts a loaded scene, so the only way to give one back is to rebuild
  # the Simulator, and a rebuild is not cheap. 2 against the measured per-producer peak:
  # a UASTC SceneSmith House costs 2.2 GB here, so 8 producers all drawing Houses at once
  # is 18.0 GB of the 24 GB card. At 4 it would be 29.4 GB.
  scene_cache_limit: 2
  agent_max_climb: 2.0
  agent_max_slope: 90.0
  enable_hbao: false
  frustum_culling: true
  seed: 324
  physics_config_file: "data/default.physics_config.json"
  enable_physics: true

  sensors:
    event_camera_1:
      type: "event"
      position: [0.0, 0.0, 0.05]
      orientation: [0.0, 0.0, 0.0]
      width: 640
      height: 480
      hfov: 90
      zfar: 40.0
      # DVS-Voltmeter: a stochastic process per pixel rather than a fixed contrast
      # threshold, so noise, leakage and latency come from the model, not a knob.
      backend: "voltmeter"
      camera_type: "DVS346" # k1..k6 preset; `k` below overrides it
      leak_scale: 1.0 # scales k4 (thermal) and k5 (photocurrent) leakage drift
      randomize_phase: true # else static pixels fire in lock-step, flashing whole frames
      anti_aliasing: 8

    depth_camera_1:
      type: "depth"
      position: [0.0, 0.0, 0.05]
      orientation: [0.0, 0.0, 0.0]
      width: 640
      height: 480
      hfov: 90
      zfar: 1000.0

controller:
  model: "rotorpy_se3"
  vehicle: "crazyflie"

dynamics:
  model: "rotorpy_multirotor_euler"
  vehicle: "crazyflie"

trajectory:
  model: "habitat_random_minsnap"
  seed: 42
  target_length: 45.0 # v_avg tops out at 1.5, so 30 s needs 45 m or the path runs out
  min_waypoint_distance: 0.5
  max_waypoints: 100
  v_avg: 1.0
  yaw_rate_max: 1.0472 # rad/s = 60 deg/s; RateLimitedYaw enforces it after the solve

safety:
  # End the episode when the drone leaves the scene
  abort_out_of_bounds: true
