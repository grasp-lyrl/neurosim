# Obstacle-FREE twin of velocity_dodge_static.yaml.
#
# Exists only so the SAME seed can be flown with and without obstacles:
# the pixelwise difference between the two event streams is then the
# obstacle's contribution, with no need to project its position into the
# image. Differs from the parent in exactly one key (dynamic_obstacles.
# enabled) -- if that stops being true the paired measurement is invalid.

# Straight PPO on the actual target policy: actor perceives obstacles only
# through the event camera + its own state (obs_mode: combined,
# privileged_actor: false). The critic keeps ground-truth nearest-obstacle
# geometry (privileged_critic: true) for variance reduction, standard
# asymmetric actor-critic -- the actor never sees it.
seed: 42
num_envs: 16
# 4M: v14 (2M) never converged -- success by quarter ran 13.2 / 9.0 / 23.0
# / 26.6%, a back-half slope of +7 points per 1M steps. Every "plateau"
# called during that run was premature.
total_timesteps: 4000000
n_gpus: 2
envs_on_gpu0: 6
eval:
  # Halved in frequency (was 16384) now that the budget is 2M and each eval
  # runs 40 episodes: at the old cadence that is ~122 evaluations, enough
  # blocking eval time to rival the training it is measuring.
  freq: 32768
  # Raised from 30: success here is a bursty, low-probability event, and
  # small-n eval has repeatedly misled this project -- the v7 final policy
  # scored 1/8 on one seed batch against 13/40 on a wide sweep. Any number
  # quoted as definitive needs a wide, disjoint seed range.
  episodes: 40
  num_envs: 1
vec_env:
  type: auto
  start_method: spawn
env:
  # Controller runs at control_rate (100 Hz); the policy is queried
  # every Nth controller update, so 2 -> 50 Hz decisions. Slowing the
  # controller itself instead cost attitude-loop phase margin and the
  # vehicle intermittently tipped over and fell.
  # 5 -> 20 Hz decisions (controller still 100 Hz). At 50 Hz the config's own
  # use_sde note records the problem: i.i.d. exploration "reaches only ~11% of
  # the displacement a sustained action would", which gSDE was then added to
  # work around. A slower decision rate fixes that directly. It also cuts the
  # credit-assignment horizon from 750 steps/episode to 300 for a dodge that
  # occupies ~7 of them, and accumulates 50 ms of events per decision instead
  # of 20. Cost is 50 ms of reaction latency against a ~250-350 ms usable
  # detection window. Slowing the *controller* is what previously cost
  # attitude phase margin; this leaves it untouched.
  policy_decimation: 5
  # Actor perceives the world through the event camera + its own state,
  # not privileged geometry -- see privileged_actor/privileged_critic below.
  obs_mode: combined
  # 10 s at the scattered density gives 4.3 encounters/episode (measured,
  # zero-action): success stays conjunctive but sensitive (0.63 at p=0.9 per
  # encounter, vs 0.56 at 15 s), and 201 steps/episode against the old 750
  # is most of the credit-assignment gain the 20 Hz change was for.
  # 15 s, not 10, so the slalom is flyable within the vehicle's measured
  # acceleration budget. Obstacles span max(2.5, 0.12L)..0.88L, so at
  # L = 6 m (10 s) the 2.5 m floor compresses four obstacles into 2.78 m --
  # 0.93 m gaps, 1.55 s apart. Clearing the lane pattern needs a ~0.5 m
  # lateral move per gap, which at 1.55 s demands ~2.0 m/s^2 (11.8 deg tilt).
  # Measured on this airframe: 0.8 m/s^2 tracks cleanly at 7.4-8.7 deg,
  # 1.6 flips 1 seed in 4, 3.2 flips all four. At 15 s the gaps become
  # 1.81 m / 3.01 s and the same manoeuvre needs 0.54 m/s^2.
  # 20 s. Oracle vs episode length at n=30 (required lateral accel in
  # brackets, against the 0.8 m/s^2 this airframe tracks cleanly):
  #   10 s [2.00] -> 2.5%   15 s [0.54] -> 36.7%
  #   20 s [0.25] -> 76.7%  26 s [0.13] -> 66.7%
  # The oracle was never a bad planner -- it was being asked to fly
  # trajectories the vehicle cannot track, which only became visible once
  # offset_accel_limit_mps2 stopped it from violating physics. 20 s puts the
  # demand 3x inside budget; longer buys nothing and costs collection time.
  # 15 s at 1.0 m/s = 15 m, inside all 20 sampled seeds (min 15.3 m).
  # Gap time is ~0.88*secs/(n-1) and is independent of cruise speed, so
  # obstacle count trades against episode duration, not against speed.
  episode_seconds: 15.0
  init_speed_range:
  - 0.0
  - 0.0
  safety:
    enable_navigable_check: false
  event_representation:
    model: time_surface
    log_compression: 1.0
    downsample_factor: 1
    # Matched to the 20 Hz decision period (50 ms). At 10 ms the surface
    # decayed to nothing within a fifth of a control step, so most of the
    # interval between decisions contributed nothing to what the policy saw.
    #
    # A 10->60 ms test under the *old* aimed obstacles made contrast worse
    # (event mass 82k->239k but threat-vs-quiet ratio 1.118->1.014): a
    # constant-bearing obstacle barely moves on the image plane, so longer
    # integration added background egomotion and almost no signal. Scattered
    # throws cross the field of view instead, accumulating a coherent streak
    # at a velocity distinct from the background -- so that result is
    # evidence about the old geometry, not a general law. Re-measure it.
    ts_decay_ms: 50.0
    sensor_uuid: null
  task:
    name: velocity_dodge
    config:
      # 0.25, down from 0.5. Measured directly: the privileged oracle earns
      # LESS total reward than doing nothing (-347.2 vs -315.0 per episode)
      # while succeeding 2.5x as often. It gains +100.9 by crashing less and
      # pays -122.3 in tracking penalty for the displacement its dodges
      # require -- so under the old weight, dodging competently was a losing
      # trade and every policy correctly learned to stay near-passive. That
      # is the common cause behind the whole v14-v18 sequence, not the
      # separate optimisation failures each run appeared to show.
      # Break-even is w_pos = 0.327; 0.25 leaves real margin.
      w_pos: 0.25
      # 0.15, between the original 0.3 and the 0.0 that replaced it, both
      # of which failed in opposite directions:
      #   0.3 made any displacement up to 0.3 m free, and v7 converged on
      #   exactly that loophole -- a permanent ~0.35 m standing offset with
      #   no threat modulation at all (0.345 m with obstacles *disabled*
      #   vs 0.340 m during real threats), scoring 13/40 against a
      #   do-nothing baseline's 14/40.
      #   0.0 then priced *every* metre of pos_error, including the
      #   controller lag and transient excursion a genuine dodge cannot
      #   avoid. Measured on v8: -0.526 reward/step, so a full 751-step
      #   survival scored -395 against -161 for crashing at step 192 --
      #   the policy was paid 234 to die early, and did.
      # Now 0.0. A 3-arm probe resumed from the same v11 checkpoint
      # (150k steps each: no change / deadband 0.0 / w_clearance 2.0)
      # measured the standing offset with obstacles *disabled* at 0.654
      # unchanged, 0.572 here, and 0.600 for the clearance arm -- so
      # neither term is what produces the offset. But this arm survived
      # 321 steps against the unchanged arm's 250 (do-nothing is 256), so
      # it earns its place on survival even though it does not remove the
      # offset. Safe now in a way it was not at v8: w_survival is 0.10
      # rather than 0.02 and the crash penalty scales with forfeited time,
      # so quiet tracking still nets about +0.055/step.
      w_pos_deadband_m: 0.0
      # 0.08, down from 0.25 -- the term that actually punished dodging.
      # Halving w_pos alone did NOT flip the ordering (oracle -313.3 vs
      # do-nothing -312.6, still tied), because r_track bundles position
      # AND velocity error and only the position half moved. Separating the
      # two from measurements at w_pos 0.5 and 0.25 shows why: the oracle
      # accumulates a velocity-error sum of 254 against the passive
      # policy's 18, so a dodge is penalised ~14x more through velocity
      # than the thing it is avoiding costs. At 0.08 the oracle finally
      # scores above passive by ~40 per episode.
      w_vel: 0.08
      # Deliberately NOT raised alongside the deadband removal: this term
      # prices correction *energy*, which a genuine transient dodge spends
      # just as hard as the degenerate standing offset did, so raising it
      # taxes the behaviour we want. The deadband removal above already
      # separates the two by an order of magnitude on its own.
      w_correction: 0.02
      w_smooth: 0.01
      # Raised from 0.02, which was far too small to make staying alive
      # worth its own tracking cost: with competent tracking inside the
      # deadband above, each step is now worth about +0.075 net, so a full
      # episode of survival earns ~+56 instead of bleeding reward.
      w_survival: 0.10
      w_along_track: 1.0
      # Explicitly answers "get back on the path when nothing is inbound".
      # This could not work before: the drone was flagged in-threat on
      # 96.2% of steps at the old obstacle density, so there was barely a
      # no-threat condition to reward -- and with threat nearly always on,
      # a permanent offset was very close to the correct policy, which is
      # exactly what every run converged to. At the reduced density it is
      # 73% / 27%, so this term now applies on roughly a quarter of steps.
      # Now priced on pos_excess (the actual deviation) rather than the
      # commanded offset. Measured on v24: no-threat steps ran pos_error
      # 1.633 m against an offset_cmd of 0.280 m, so the old form charged
      # 17% of the excursion and left the standing-offset exploit -- which
      # lives in the other 83% -- completely free. Weight retuned for the
      # ~6x larger quantity it now multiplies; see outputs/rl/no_threat_gate.json
      # for the oracle-vs-nominal-vs-wander sweep that set it. Over 20
      # episodes the oracle's margin over passivity erodes only 11% across
      # the whole sweep (+163.6 at w=0 to +145.9 at w=0.5), so dodging still
      # wins everywhere; 0.3 keeps 94% of that margin (+153.0) while adding
      # +22 to the margin over a wandering arm. Charges ~0.49/step on the
      # measured 1.63 m no-threat deviation, all of it escapable by
      # returning to the path.
      w_no_threat_offset: 0.3
      # Braking removed: the correction is lateral + vertical only. The
      # policy was spending ~36% of in-threat steps at FULL reverse with a
      # near-zero mean forward command -- bang-bang braking, which is also
      # what made the motion look like inching. Measured cost to a
      # privileged oracle on this exact config: 43.3% -> 36.7% success, so
      # braking is genuinely load-bearing for an optimal planner, but only
      # worth 6.6 points, and our policies have never come near that
      # ceiling anyway. In exchange the action space collapses from 3
      # meaningful axes to 2 and the forward oscillation disappears.
      # Headroom above the 5.0% do-nothing control is still 31.7 points.
      lateral_only: false
      # Stricter still: left/right only, zeroing vertical as well. Measured
      # cost to the privileged oracle is 46.7% -> 43.3% (n=30, inside
      # noise), so the vertical axis is nearly free to give up -- and it
      # was the axis the policy abused, since obstacles skewed upward made
      # a blanket duck profitable for a long stretch of this project. What
      # remains is a single scalar: the smallest action space that can
      # still express a dodge.
      lateral_axis_only: false
      # Lowered from 8.0. In the same 3-arm probe this arm survived 327
      # steps against 250 for the unchanged reward -- the best of the
      # three -- while trimming the standing offset from 0.654 to 0.600.
      # At 8.0 the shaping plausibly paid for permanent displacement
      # (a constant offset raises average clearance from a dense field)
      # by more than the tracking term charged for it.
      w_clearance: 2.0
      clearance_threshold_m: 1.5
      gamma_shaping: 0.994
      # Was unset (defaults to 0.0): the potential-based clearance shaping
      # below is 0 both before and after an encounter, so it telescopes to
      # ~0 net reward over a full clean dodge -- it only ever punishes
      # proximity, never rewards successfully surviving it. With no direct
      # payoff for clearing an obstacle, the only thing discouraging a
      # crash was the terminal -60 penalty: sparse, delayed, and hard to
      # credit-assign through a CNN that hasn't learned to see obstacles
      # yet. This is a dense, promptly-attributable reward fired the
      # instant a threat is confirmed cleared.
      w_encounter_clear: 8.0
      # New: obstacles get dense potential-based shaping the whole way in
      # (w_clearance above), but the scene boundary previously only had a
      # sparse terminal penalty on out_of_bounds -- v3 (600k steps) showed
      # this gap directly: encounter_clear_rate rose and held at ~60-70%
      # (up from v2's flat 35-55%), confirming the exploration fix worked,
      # but out_of_bounds terminations *worsened* over the run (2/6 -> 3/6
      # between the 131k and 278k checkpoints, confirmed on video both
      # times) as evasive corrections grew large enough to exit the scene
      # with no graduated feedback on the way there. Same potential-based
      # construction as w_clearance, aimed at the boundary instead.
      w_boundary: 8.0
      boundary_margin_threshold_m: 1.0
      # Raised from 60: at that level a crash was cheap enough that ending
      # the episode early beat paying per-step tracking cost to keep
      # flying (v8: crashing at step 192 scored -161 against -395 for
      # surviving to 751). 150 keeps dying decisively worse than living
      # even in an episode spent mostly dodging.
      crash_penalty_scene: 150.0
      crash_penalty_obstacle: 150.0
      # Charges a crash for the episode it forfeits, on top of the flat
      # penalties above. 0.6/step comfortably out-prices the worst per-step
      # rate either failed run produced (-0.51), putting the break-even at
      # r < -0.85 instead of v9's -0.25, so exploration noise can no longer
      # make dying the profitable move. See VelocityDodgeTask.crash_penalty.
      crash_penalty_per_remaining_step: 0.6
      # An oracle dodging at full authority achieves a median
      # clearance of 0.064 m, so a 0.1 threshold made success
      # unreachable by construction -- success_rate was pinned at 0
      # for reasons unrelated to learning.
      dodge_clearance_m: 0.02
      # Asymmetric actor-critic: critic gets ground-truth nearest-obstacle
      # geometry to reduce value-function variance; actor does not (see
      # privileged_actor below) -- it must dodge from what it can actually
      # perceive.
      privileged_critic: true
      require_obstacle_encounter: true
      tracking_failure_pos_error_m: 3.0
      tracking_failure_steps: 25
      threat_distance_m: 1.5
      # Raised from 1.0: a privileged, collision-checked scripted oracle
      # (evaluate_velocity_dodge_oracle.py --expert) only cleared 20% of 30
      # fresh-seed episodes under the old budget, with offset_tau_s=0.8s
      # able to reach only ~71% of offset_max_m within a 1.0s reaction
      # window -- that's close to a real feasibility ceiling, not a policy
      # competence gap. 1.5s lets the same integrator reach ~85% of budget
      # before impact, paired with slower/farther throws below so there's
      # always enough flight time for the wider window to actually apply.
      # Re-measured with the oracle after this change: 53.3% (16/30),
      # landing in the intended 40-60% band -- enough headroom for the
      # policy (event_actor_v6 plateaued at ~11% under the old budget) to
      # actually climb toward, instead of asymptoting against a ~20% wall.
      threat_time_horizon_s: 1.5
      controller:
        model: rotorpy_se3
        vehicle: crazyflie
      trajectory:
        model: habitat_random_minsnap
        target_length: 15.0
        min_waypoint_distance: 2.0
        max_waypoints: 100
        max_path_attempts: 30
        # Lowered from 1.0: a slower reference gives more reaction time
        # relative to the 2-4 m/s obstacle throws and makes the reference
        # itself easier to track, while staying well under throw_speed_range_mps
        # so intercept solutions still exist (see the note on that below).
        # 1.0, up from 0.6. Path length is set by the waypoint sampler and
        # bounded by the scene (skokloster gives 20.2 m mean, 15.3 m min over
        # 20 seeds), NOT by v_avg -- so a faster reference covers more of the
        # available path per episode second, fitting more obstacles at the
        # same acceleration demand. It also roughly doubles parallax, which
        # is the event camera's actual signal. (A 2 m/s / 25 s variant was
        # considered and rejected: it needs 50 m, available in 0/20 seeds.)
        v_avg: 1.0
        # Altitude is measured above the LOCAL floor at each sampled point,
        # not the scene's global AABB -- the earlier global-bounds version
        # let the drone fly at ~0.27 m above floor in places, well within
        # furniture height, because the AABB-relative margin said nothing
        # about what a couch's actual local floor clearance requires.
        min_altitude_m: 1.0
        ceiling_margin_m: 0.3
        lateral_margin_m: 1.0
        bounds_margin_m: 0.3
        # Validate the finished MinSnap curve against Habitat's actual 3-D
        # scene mesh. The navmesh alone cannot detect walls/furniture at flight
        # altitude. This includes the Crazyflie body plus a safety margin.
        static_clearance_m: 0.20
        collision_sample_spacing_m: 0.05
      # gated_cascaded_velocity was tried here and reverted. The appeal was
      # structural: a closed gate actively restores the nominal path, so
      # "stop deviating" would not have to be bought with reward, and it is
      # the space the expert and the lost BC loss both speak. But with no
      # displacement clip and the restoring loop switched off while the gate
      # is open, even the privileged oracle wanders -- measured on this
      # exact config it scored 23.3% / 492 steps against 36.7% / 535 here,
      # with tracking_failure rising from 1 to 5 of 30 episodes. Training
      # against an action space that costs a third of the achievable
      # ceiling is not worth the alignment with BC; the expert can be
      # re-expressed in this 3-dim space instead (oracle_action already
      # has that branch).
      residual_control:
        # No integrator: the action IS the target displacement, scaled by
        # offset_max_m, tracked with a short lag and a rate limit. With
        # squash_output bounding the action to [-1, 1] the reachable set is
        # exactly offset_max, so nothing needs an integrator to enforce it,
        # and a constant action means "hold this offset" instead of "keep
        # accelerating sideways" -- the coupling that forced the policy to
        # sit saturated just to maintain a displacement.
        # Measured: the privileged oracle scores 46.7% here against 36.7%
        # under velocity_delta_integrated, with the do-nothing control
        # unchanged at 5.0% -- so this widens the headroom band from 31.7
        # to 41.7 points. First control-mode change this session that
        # raised the ceiling rather than lowering it.
        # Trade-off accepted: a position target couples speed to distance
        # (initial speed = min(target/tau, rate_limit)), so the policy
        # cannot ask to arrive slowly. Full 0.56 m arrives in ~0.5 s
        # against a 1.5 s threat window, so that authority is not needed.
        mode: desired_body_offset
        # Raised from 0.56/0.56/0.36. The expert's planner offers candidate
        # displacements up to 1.00 m, so the old cap was clipping its choices
        # -- but a 20-episode A/B on matched seeds scored 7/20 either way
        # (failure mix near-identical), so the extra authority is free rather
        # than load-bearing. Kept because nothing argues for the artificial
        # limit, not because it was measured to help.
        offset_max_m:
        - 1.2
        - 1.2
        - 0.8
        offset_command_tau_s: 0.2
        # Bounds the reference-velocity feedforward handed to SE3 (the
        # derivative of this offset); an unlimited step would spike it and
        # Kd would turn that straight into acceleration.
        # Same attitude-instability fix applied to the dynamic config:
        # tau 0.2 with a 1.5 m/s ceiling steps the offset velocity to
        # ~amp/tau and inverts the vehicle past 109 deg on a 0.45 m sidestep
        # (4/4 seeds, empty scene). This task is especially exposed because
        # the cloned policy holds a standing ~0.46 m offset -- measured here
        # as 35/40 episodes ending out_of_bounds.
        offset_accel_limit_mps2: 0.8
        offset_rate_limits_mps:
        - 0.8
        - 0.8
        - 0.5
        action_filter_tau_s: 0.15
      # Not a diagnostic run: the actor sees only its own state + events,
      # matching what a real drone could actually perceive.
      privileged_actor: false
  # skokloster only, for training and eval alike. apartment_1's rooms are
  # tight enough that clearing an obstacle and staying in bounds are in
  # direct tension (the privileged oracle itself went out of bounds in
  # 3-4 of 30 episodes there), so a large fraction of episodes had no
  # good answer available. env.py takes scenes[0], so listing one scene
  # is also what actually makes the choice take effect.
  scenes:
  - name: skokloster
    path: data/scene_datasets/habitat-test-scenes/skokloster-castle.glb
  sensors:
    event_camera_1:
      type: event
      position:
      - 0.0
      - 0.0
      - 0.05
      orientation:
      - 0.0
      - -1.5707963267948966
      - 0.0
      width: 640
      height: 480
      hfov: 120
      zfar: 20.0
      backend: cuda
      contrast_threshold_neg: 0.15
      contrast_threshold_pos: 0.15
      anti_aliasing: 8
  visual_backend:
    enable_physics: true
    agent_radius: 0.15
    # Keep shortest paths away from wall/furniture boundaries; the finished
    # curve is independently checked against the 3-D mesh below.
    navmesh_agent_radius: 0.25
    dynamic_obstacles:
      enabled: false
      # Switched from the scripted intercept scheduler (guaranteed-hit
      # throws solved against the nominal trajectory) to this simpler,
      # organic spawner: throws are aimed at wherever the drone actually is
      # at spawn time, plus noise, with no solve against a future path.
      # Less scripted, more naturalistic obstacle field for a straight PPO
      # run.
      intercept_schedule:
        enabled: false
      # 14 concurrent (v8) was too dense to be learnable: ~15 throws per
      # episode against a success criterion that is conjunctive over every
      # one of them pinned success_rate at 0 regardless of skill, and left
      # no quiet stretch in which tracking well was even possible -- the
      # threat flag was true on 100% of sampled steps. 6 keeps the field
      # busy while leaving gaps to track through, so the reward can tell
      # dodging and loitering apart.
      spawn_interval_s: 3.0
      # +/-60%: waits land in [1.0, 4.0] s. At a fixed 2.5 s the policy's
      # speed swung 78% of its mean with phase in the spawn cycle while its
      # commanded action barely changed -- it was riding the clock, not
      # reacting to what it saw.
      spawn_interval_jitter: 0.6
      # Raised from 3 with scattered aim. Density and *threat* density are no
      # longer the same thing: an aimed field makes nearly every throw a
      # threat, while scattered throws mostly pass by, so 10 concurrent here
      # is far less punishing than the 14 aimed that pinned success at 0.
      # 5, from a concurrency sweep under re-aiming (control/oracle, throw
      # rate held constant): the gap peaks here at +18.8 points and inverts
      # by 8. Too many re-aiming throws and the whole threat formation
      # follows the drone, leaving the relative geometry invariant to its
      # motion -- evasion is then impossible in principle. Too few and
      # passivity survives anyway.
      #   2 concurrent: control 75.0%  oracle 81.2%  gap  +6.2
      #   3 concurrent: control 62.5%  oracle 75.0%  gap +12.5
      #   5 concurrent: control 50.0%  oracle 68.8%  gap +18.8
      #   8 concurrent: control 50.0%  oracle 43.8%  gap  -6.2
      # Deliberately sparse. This config exists to validate the pipeline
      # against a near-perfect expert, not to be hard: with 4 concurrent at a
      # 1.0 s interval a new obstacle appeared 2-3.5 m ahead every second, so
      # the drone dodged straight into the next one and the conjunctive
      # success criterion compounded the losses (oracle 15.0%).
      max_concurrent: 6
      # Pre-placed on the nominal path at reset; disables the in-flight spawner.
      # 6, not 4: the blind-guessing ceiling is ~2^-traps, and with only
      # 2 traps a constant lateral offset clears both ~25% of the time
      # (measured: constant-offset arms hit 25-30% once trap sides were
      # randomised). 3 traps takes that to ~12.5%.
      static_obstacle_count: 6
      # 0.6, not 0.9. The required lateral move between lanes sets the
      # acceleration demand (a ~ 2*pi^2*(S/2)/gap_t^2); a smaller trap offset
      # cuts S from ~0.5 m to ~0.35 m, which buys the tighter gaps that 6
      # obstacles need while staying inside the measured 0.8 m/s^2 budget.
      slalom_offset_m: 0.6
      # Slowed from [2.0, 4.0] and spawns moved farther out below: paired
      # with threat_time_horizon_s above, this guarantees enough total
      # flight time (min ~7m/3.0mps=2.33s) for the widened reaction window
      # to actually be reachable rather than clipped by the throw arriving
      # first. See threat_time_horizon_s comment for the oracle evidence.
      throw_speed_range_mps:
      - 1.5
      - 3.0
      angular_speed_range_radps:
      - 0.0
      - 1.0
      azimuth_range_deg:
      - -45.0
      - 45.0
      # Short lead: placement extrapolates the *current heading*, and the
      # MinSnap path curves. At 7 m (a 5.8 s extrapolation at 1.2 m/s) the
      # drone turned away and passed no closer than 1.27 m from a 0.45 m hit
      # radius -- 4 obstacles per episode, none of them an obstacle. 2-3.5 m
      # is a 1.7-2.9 s lead, over which the straight-line assumption holds.
      radial_distance_range_m:
      - 3.0
      - 4.5
      # Symmetric about the drone (was [-0.25, 1.0], skewed strongly
      # upward). That skew put 61% of obstacles above the vehicle, and the
      # v12 policy found the blanket answer: its mean offset was
      # [+0.009, +0.094, -0.290] in world axes -- 95% of it straight down.
      # Ducking beats the whole obstacle distribution without perceiving
      # anything, which is why it persisted with obstacles disabled and why
      # the deadband, clearance-shaping and lead-aim changes each moved it
      # by under 10%: none of them touched the asymmetry paying for it.
      # Symmetric spawning leaves no free direction -- descending now helps
      # against half the throws and hurts against the other half, so only
      # reacting to the specific incoming obstacle works.
      relative_height_range_m:
      - -0.6
      - 0.6
      aim_noise_std_m: 0.3
      # Half the throws lead the drone, half aim where it is at spawn time.
      # Aiming only at the current position made motion itself evasive:
      # over a 1.4-2.0 s flight a drone drifting at ~1.1 m/s displaces
      # several times the 0.30 m hit radius, so v10 survived above the
      # do-nothing control (318 vs 254 steps) while holding a 0.72 m
      # standing offset and never modulating it for threats -- it was
      # rewarded for wandering, not for seeing. A pure lead solve would
      # just invert the exploit (hold still and the intercept degenerates),
      # so the two are mixed per throw.
      #
      # Raised 0.5 -> 0.8. At an even split, half of all throws still aimed
      # where the drone was at spawn time, and for those a sustained drift
      # remains genuinely evasive -- so the ~0.6 m standing offset was not a
      # reward hack but a rational answer to half the obstacle population,
      # which is why neither reward change above removed it. At 0.8 drifting
      # only answers one throw in five, while keeping enough
      # current-position aim that simply freezing (which degenerates the
      # intercept solve) is not a blanket answer either.
      # Aiming at all is what made position itself a strategy, so both aim
      # modes are off and throws scatter through the neighbourhood instead.
      lead_aim_probability: 0.0
      # Scatter is now a diversity term, not the difficulty knob: re-aiming
      # is what makes throws threatening, so the spread only keeps them from
      # arriving identically.
      # 0.3, down from 1.0. Preserving each throw's scatter offset through
      # re-aiming meant throws tracked faithfully to a point ~0.75 m from the
      # drone -- well outside the ~0.3 m combined hit radius -- so they were
      # aimed to miss by construction, and a passive drone still survived
      # 57.5% of episodes.
      #
      # Wide scatter was only ever needed because aiming once at spawn made a
      # tight aim escapable by drifting. Re-aiming removes that coupling, so
      # the aim can be tight again: the offset now supplies variety, not a
      # built-in miss.
      aim_scatter_m: 0.15
      # Throws steer toward their aim point until 0.5 s before arrival, then
      # go ballistic. Drifting stops paying (they follow), while a late
      # decisive dodge still works -- and that puts the required reaction in
      # the window where the event signal is strongest (SNR 0.014-0.020 at
      # 0.25-0.5 s, against 0.008 further out).
      reaim_commit_time_s: 0.0
      reaim_max_turn_rate_radps: 2.0
      seed: 7
      # Mixed motion models. With every obstacle on a straight line aimed at
      # the drone, the approach is constant-bearing: the obstacle barely
      # translates in the image and only looms, sitting at 9-18 px for most
      # of its flight and filling the frame in the last ~0.2 s. That is the
      # weakest possible signal for an event camera, which fires on
      # image-plane motion -- so the thing the policy most needs to see is
      # nearly invisible until it is too late to act on.
      #
      # A parabola curves, so its bearing changes throughout the flight and
      # it sweeps across the image. Gravity is 3.0 rather than 9.81 on
      # purpose: the ballistic solve launches upward to compensate, and at
      # Earth gravity that pushes true speed to 8.5-11 m/s (vs the nominal
      # 5). At 3.0 the arc is pronounced while speed stays 5.4-5.8 m/s.
      templates:
      - handle: uvSphereSolid
        scale:
        - 0.3
        - 0.3
        - 0.3
        motion_mode: static
        mass: 0.2
        ttl_s: 8.0
        collision_radius: 0.3
        kinematic_speed_mps: 0.0
  dynamics:
    model: rotorpy_multirotor_euler
    vehicle: crazyflie
    control_abstraction: cmd_ctbr
    max_speed_mps: 3.0
    ctbr_rate_limits:
      roll: 7.0
      pitch: 7.0
      yaw: 5.0
    domain_randomization:
      enabled: true
      resample_every: 50
      scales:
        mass:
        - 0.85
        - 1.15
        k_eta:
        - 0.9
        - 1.1
        k_m:
        - 0.9
        - 1.1
        rotor_speed_min:
        - 1.0
        - 1.0
        rotor_speed_max:
        - 0.95
        - 1.05
  simulator:
    world_rate: 1000
    control_rate: 100
    sim_time: 30
    coord_transform: rotorpy_to_hm3d
    sensor_rates:
      event_camera_1: 50
    viz_rates:
      event_camera_1: 50
    domain_randomization:
      enabled: false
      resample_every: 50
      sensors:
        event_camera_1:
          contrast_threshold_neg:
            range:
            - 0.1
            - 0.3
          contrast_threshold_pos:
            range:
            - 0.1
            - 0.3
          hfov:
            choices:
            - 90
            - 120
ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 128
  n_epochs: 4
  gamma: 0.994
  gae_lambda: 0.95
  clip_range: 0.2
  # Was 0.0: nothing was counteracting PPO's tendency to shrink action
  # variance once it settles anywhere, even a degenerate "don't act" optimum
  # -- which 600k steps of the previous run (v2) settled into exactly,
  # producing behavior identical to the zero-action baseline throughout.
  # v3+v4 (~1.2M combined steps) then sat at this constant 0.01 too long:
  # log_std barely moved (-0.60 -> -0.67 over v4's 600k), stochastic-rollout
  # encounter_clear_rate stayed healthy (noise-assisted dodges) while
  # deterministic eval success stayed flat near 0% -- the mean policy never
  # had to converge because the entropy bonus kept propping up exploration
  # noise indefinitely. ent_coef_final below anneals this to 0 over the
  # resumed run instead of holding it constant.
  ent_coef: 0.01
  ent_coef_final: 0.0
  target_kl: 0.02
  # Raised from -1.0: with a still-random CNN and no reward for successfully
  # clearing an obstacle (see w_encounter_clear below), the policy needs
  # enough exploration variance to ever sample a real dodge attempt, or
  # gradient descent has nothing obstacle-correlated to reinforce.
  # Back to -0.5 (std 0.61) from -0.2 (std 0.82). On a [-1, 1] action space
  # 0.82 is close to uniform-random: v9 ran correction_energy 0.86 and
  # pos_error ~1.05 against 0.09 for pure tracking, i.e. exploration was not
  # perturbing a trajectory so much as replacing it with noise, and 5/8 eval
  # episodes ended out_of_bounds rather than in a collision. 0.61 still
  # explores widely, and ent_coef_final anneals it down over the run.
  log_std_init: -0.5
  # Only read on the --resume-checkpoint path, where log_std would
  # otherwise come back from the checkpoint already converged and narrow
  # (v7 finished at -0.85 / std 0.43), silently making log_std_init above
  # dead config. Inert for a from-scratch run.
  reset_log_std_on_resume: true
  # Independent per-step Gaussian exploration is almost entirely cancelled
  # by the residual-control leaky integrator before it ever becomes a real
  # offset: at the 50Hz policy rate against offset_tau_s=0.8s, i.i.d.
  # resampling reaches only ~sqrt(dt/2*tau) =~11% of the displacement a
  # sustained action would -- measured to match: peak in-threat offsets of
  # ~0.06-0.09m against a 0.56m budget, right at that ratio. SDE holds
  # exploration noise correlated across sde_sample_freq steps instead of
  # resampling it every step, so it survives the integrator instead of
  # being averaged out by it.
  # Tightened from 40 to 20 (~0.4s, half offset_tau_s instead of matching
  # it): v3 confirmed the exploration fix worked (encounter_clear_rate rose
  # and held at 60-70%) but also grew a large, worsening out_of_bounds
  # failure mode -- a 40-step hold lets one uncorrelated SDE sample commit
  # to a large push for close to a full integrator time constant with no
  # chance to recorrect mid-swing. 20 keeps most of the averaging fix
  # (dt/tau moves from 0.025 to 0.4/0.8=0.5, attenuation factor
  # sqrt(0.5/2)=0.5 instead of the original 0.11, still a ~4.5x improvement)
  # while resampling twice as often, so a bad direction gets corrected
  # sooner instead of riding out the full swing.
  # Only meaningful with --bc-warm-start: holds the cloned actor still while
  # the value head fits its returns. v15 warm-started without this and lost
  # the clone inside ~8 updates (explained_variance -0.003 -> 0.7 over that
  # span), dropping below its own starting success rate before recovering.
  actor_freeze_updates: 15
  # L2 on the pre-tanh action mean. squash_output bounds the action but not
  # the mean behind it, and both v23 and v24 died the same way: v24's mean
  # |mu| held at 0.001-0.002 through 131k steps, then hit 0.567 (max 3.661,
  # 18.5% of components past 1) by 229k, with success collapsing to 0.0% and
  # train/entropy_loss crossing zero at 164k on the way to v23's +10.9. Past
  # |mu| ~ 2 the tanh derivative is under 0.08 and the gradient stops
  # arriving. Watch train/pretanh_abs_mean and train/pretanh_frac_gt1.
  pretanh_penalty: 0.01
  use_sde: true
  sde_sample_freq: 20
  vf_coef: 0.5
  max_grad_norm: 0.5
  # Was cpu, left over from the earlier tiny-MLP (18-dim state) baseline.
  # Now that the actor runs a CNN over full-resolution (2, 480, 640) event
  # frames, CPU-side conv passes were almost certainly the dominant cost --
  # envs_on_gpu0 was already deliberately kept lower than GPU1's share
  # specifically to leave GPU0 headroom for "policy inference and the PPO
  # update" (see its comment in train_sb3.py), which only makes sense if
  # the model actually runs on GPU0. It didn't; this was silently unused.
  device: cuda:0
vecnormalize:
  normalize_obs: true
  normalize_reward: true
