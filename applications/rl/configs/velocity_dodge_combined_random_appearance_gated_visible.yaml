# for the 2x-downsampled event camera while leaving ample dodge time.
experiment_config: applications/rl/configs/velocity_dodge_combined_random_appearance_gated_history.yaml

overrides:
  env:
    task:
      config:
        threat_time_horizon_s: 2.0

