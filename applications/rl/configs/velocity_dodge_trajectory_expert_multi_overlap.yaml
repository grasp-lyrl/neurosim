# Intentional overlap validation for the continuity-preserving trajectory
# replanner. Intercepts arrive faster than a full departure-and-return bump,
# forcing cached plans to incorporate concurrent projectiles or replan from
# the vehicle's current offset/relative velocity when a new threat appears.
experiment_config: applications/rl/configs/velocity_dodge_trajectory_expert_multi_separated.yaml

overrides:
  env:
    visual_backend:
      dynamic_obstacles:
        max_concurrent: 4
        intercept_schedule:
          enabled: true
          first_intercept_s: 3.0
          interval_s: 1.8
          interval_jitter_s: 0.15
          speed_range_mps: [2.5, 3.0]
          lead_distance_range_m: [5.0, 6.0]
          azimuth_range_deg: [-35.0, 35.0]
          elevation_range_deg: [-10.0, 10.0]
          aim_offset_std_m: 0.10
          require_line_of_sight: true
          max_attempts: 24
