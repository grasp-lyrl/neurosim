# Short-window bracket after v8/v9 failed the blind-motion gate. Inherits the
# same camera-visible single-obstacle task and 3 m/s^2 vehicle limit, changing
# only projectile speed from 8 to 10 m/s. The 7--9 m spawn range gives
# 0.70--0.90 s between launch and nominal intercept.
experiment_config: applications/rl/configs/velocity_dodge_teacher_v9_speed8.yaml

overrides:
  env:
    visual_backend:
      dynamic_obstacles:
        templates:
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_line
            mass: 0.2
            ttl_s: 3.0
            collision_radius: 0.15
            kinematic_speed_mps: 10.0
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_parabola
            mass: 0.2
            ttl_s: 3.0
            collision_radius: 0.15
            kinematic_speed_mps: 10.0
            parabola_gravity_mps2: 3.0
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_line
            mass: 0.2
            ttl_s: 3.5
            collision_radius: 0.15
            kinematic_speed_mps: 10.0
