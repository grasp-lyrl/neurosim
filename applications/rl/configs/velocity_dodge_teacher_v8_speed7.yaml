# Shorter-reaction-window candidate derived from the accepted camera-visible,
# acceleration-3 v6 task.  Only projectile speed changes: 7--9 m spawns now
# provide 1.00--1.29 s before arrival instead of v6's 1.40--1.80 s.
#
# Non-degeneracy gate before any teacher promotion:
#   * zero, held offsets, blind weave and held-random motion all <= 20% success
#   * sampling-MPC oracle >= 80% success with zero collisions
#   * <= 3.0 m/s^2 measured vehicle acceleration
#   * clearance median >= 0.25 m and p10 >= 0.15 m
experiment_config: applications/rl/configs/velocity_dodge_teacher_v6_accel3.yaml

overrides:
  env:
    visual_backend:
      dynamic_obstacles:
        templates:
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_line
            mass: 0.2
            ttl_s: 3.0
            collision_radius: 0.15
            kinematic_speed_mps: 7.0
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_parabola
            mass: 0.2
            ttl_s: 3.0
            collision_radius: 0.15
            kinematic_speed_mps: 7.0
            parabola_gravity_mps2: 3.0
          - handle: uvSphereSolid
            scale: [0.15, 0.15, 0.15]
            motion_mode: kinematic_line
            mass: 0.2
            ttl_s: 3.5
            collision_radius: 0.15
            kinematic_speed_mps: 7.0
