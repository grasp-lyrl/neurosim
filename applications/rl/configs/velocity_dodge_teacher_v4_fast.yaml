# v20 = v19 with dodge_clearance_m 0.02 -> 0.35, so that "cleared" finally
# means "did not hit the vehicle". Contact is at 0.30 m (agent_radius 0.15 +
# collision_radius 0.15); the old 0.02 m threshold paid for collisions.
# This invalidates every benchmark measured before it -- the 0.696 clear
# rate, the blind sine weave, the do-nothing floor and the privileged oracle
# all have to be re-measured under the corrected threshold before any of
# them mean anything. Run the gates first (oracle feasibility, control
# floor, both blind baselines), THEN train. Full reasoning at
# dodge_clearance_m below.
#
# v19 = v18 + freeze_extractor_for_ppo. Single-variable A/B against v18,
# testing the last standing explanation for the capability ceiling: that
# PPO's gradient destroys the pretrained event encoder (0.64 -> 0.13 in
# every run so far), leaving a policy that cannot aim a dodge. Baseline to
# beat is v18's steady state: encounter_clear_rate 0.696, success 0.411,
# authority_used_in_threat 0.119. Full reasoning at
# freeze_extractor_for_ppo below.
#
# v18 = v17 with the two things that actually kept the policy still:
#   * sde_sample_freq 20 -> 8   (stale after the 50 Hz -> 20 Hz decision-rate
#                                change; the hold had become 1.0 s against a
#                                0.8 s integrator constant)
#   * w_encounter_clear 8 -> 30 (dodging harder was marginally negative in
#                                expectation at 8)
# v17 ran 620k steps with authority_used_in_threat pinned at 0.152 and
# encounter_clear_rate at 0.68, both flat to three digits for the whole run,
# while authority_free_at_onset stayed 0.936. Nothing about the dodge moved.
# That is not a slow learner: exploration could only propose a standing
# offset, and the reward correctly priced standing offsets as a loss. Both
# halves of that loop are addressed here. Reasoning at each key below.
#
# v17 = v16_effnet with the rollout horizon restored (n_steps 128 -> 256,
# batch_size 32 -> 128). v16_effnet ran 294k steps with stable memory and
# learned nothing: the rollout was shorter than an episode AND shorter than
# the gamma horizon, so explained_variance never left zero. Full reasoning at
# the n_steps entry below. Everything else is unchanged from v16_effnet.
#
# v16: stacked frames instead of recurrence -- RecurrentPPO leaks.
#
# sb3-contrib's RecurrentPPO retains ~282 MiB per update, permanently. Ruled
# out by elimination, with instrumentation rather than inference:
#   * not the auxiliary term -- growth continued unchanged at +282 after the
#     aux callback stopped cleanly at 22016 steps
#   * not BPTT sequence length -- episode length sat flat at ~150 steps while
#     allocation climbed 4.0 -> 16.3 GB
#   * not batch-proportional -- the delta is +282 at BOTH 8 and 4 envs, so it
#     is constant per occurrence. Fewer envs therefore means MORE updates per
#     environment step and a FASTER leak, not a slower one.
# Nothing in configuration survives a multi-million-step run against that.
#
# Frame stacking gives the temporal context the task needs -- a single time
# surface shows where edges fired, not how fast the obstacle is closing --
# without BPTT. history_frames 4 at the 50 ms control period is 200 ms of
# context.
#
# ts_decay_ms stays at 50: stacked frames are one control period (50 ms)
# apart, so a 50 ms window tiles time with no gaps and no overlap. A shorter
# window would sharpen each frame (measured peak_z 5.90 at 5 ms vs 5.20 at
# 50 ms, ~13%) but drop the events falling between frames -- at 15 ms, 70% of
# them. Sub-control-step sampling in EventRepresentationManager would give
# both, but that is a code change, not a config knob.
#
# n_steps back to 256 (12.8 s at 20 Hz, a full episode). Without BPTT the
# buffer is 8 x 256 x 4 frames = 5.0 GB, affordable. The 32 I had been forced
# down to was 1.6 s -- barely one encounter -- so nearly all credit came from
# bootstrapped value estimates rather than observed dodge outcomes.
#
# Everything the encoder work established carries over unchanged: occupancy
# target (not depth), 4 m supervision gate, both extractors frozen for PPO,
# two-phase aux shutoff. Aux R2 crosses zero at ~18k steps, peak 0.0901,
# reproduced across five runs.

# v15: recurrence, and stop supervising the decoder on invisible obstacles.
#
# Three changes over v11:
#  1. num_envs 16 -> 8. v11 died at 213k steps with CUDA OOM -- 16 x 512 x a
#     (2,480,640) event tensor is ~20 GB of rollout buffer on a 23.5 GB card
#     (18.3 GB actually held). 8 x 512 is ~10 GB.
#  2. distance_aux_near_range_m 4.0. Events come from apparent motion, so a
#     distant obstacle generates few of them however many pixels it covers;
#     those frames were near-unlearnable and MSE weighted them equally with
#     close ones. 4 m is still inside the actionable window (0.8 s at 5 m/s
#     against the 0.64 s a dodge needs).
#  3. recurrent: true -- see the comment on the key below.
#
# What v11 actually showed before the OOM: distance_r2 improved -19.5 -> -1.36
# but stayed negative, while reported success reached 44%, level with a blind
# 0.5 Hz weave. Evaluating that checkpoint deterministically gave
# act_energy 0.0000 and 12% success against a blind twin's 28% -- both at the
# ~15% control floor. The policy's MEAN action was ~0 (pretanh_abs_mean
# 0.00346); the training success was exploration noise. Nothing had been
# learned in ~90k unfrozen actor steps, so that run says nothing about
# perception either way.
#
# Gate: distance_r2 going positive is the signal that the encoder can see. If
# it stays negative WITH recurrence and the near-range gate, the encoder
# itself is the limit and EfficientNet-scale capacity is the honest next step
# rather than more steps at this size.

# v14: fix the OOM and stop supervising the decoder on invisible obstacles.
#
# num_envs 16 -> 8. The v11 run died at 213k steps with CUDA OOM: 16 envs x
# 512 n_steps x a (2,480,640) event tensor is ~20 GB of rollout buffer on a
# 23.5 GB card. It survived 26 iterations, then a 600 MB allocation tipped it
# over. 8 envs halves the buffer to ~10 GB.
#
# distance_aux_near_range_m 4.0 -- see the comment on the key below.

# v11: onto the cmd_vel path, which is the repo's own fix for the flip.
#
# v10 changed residual_control mode to velocity_delta_integrated and did NOT
# help (achieved deviation p90 3.625 m vs v7's 3.454 m, out_of_bounds 3 -> 7).
# The name explains why: it INTEGRATES the velocity residual into a position
# offset, which still goes to SE3Control. Changing residual modes does not
# leave the flip-prone controller.
#
# The failure, traced on v7 seed 9008: a smooth 0.34 m commanded dodge
# (largest single-step change 0.026 m), tilt 27.7 -> 97.2 deg, deviation
# growing 2.2 -> 5.3 m AFTER the command decayed to 0.000, ending
# out_of_bounds. velocity_rotorpy.py documents exactly this: SE3Control takes
# b3_des = normalize(F_des) "with nothing keeping the vehicle upright...
# thrust projects to ~zero and the vehicle free-falls without recovering.
# Measured in ~10-15% of episodes with *zero* policy action." The oracle's
# out_of_bounds rate across v7/v7b/v10 is 15-35%.
#
# The remedy is a different VEHICLE, not a different residual mode:
# control_abstraction cmd_vel builds RotorpyVelocityVehicle, whose force law
# F_des = m*(-k_v*(v - cmd_v) + g) has no position term, so tipping requires a
# velocity error beyond ~g/k_v (~1 m/s) rather than a 0.65 m altitude error.
#
# Everything measured on v1-v9 was scored against an oracle being flown out of
# bounds by its own controller -- it plans sound dodges (median commanded
# 0.35 m, 80% of episodes >= 0.30 m) and cannot execute them. The blind
# baselines that "beat" it win by commanding smooth low-frequency motion that
# keeps F_des upright.
#
# Gate: oracle_authority_probe should show achieved deviation close to
# commanded and max tilt well under 90 deg. Only then re-run oracle vs blind
# on BOTH return and success, and only then revisit task design.

# Dynamic dodging, v7: throws that actually lead the vehicle.
#
# lead_aim_probability was 0.0 -- NO throw led the drone. Every throw aimed
# at where the vehicle was at spawn, so after 1.4-2.0 s of flight it arrived
# 1.4-2.0 m behind a vehicle cruising at 1 m/s. Guaranteed misses. That is
# why obstacles outnumbered genuine threats 4:1 in every configuration
# measured today, and why the only throws that connected were head-on ones
# where the vehicle advances into a stationary aim point.
#
# It also means the lead-prediction error measured earlier (median 0.31 m at
# 1.4 s, 47% inside the 0.30 m hit radius) was the accuracy of a branch that
# never executed at this setting.
#
# The v5/v6 pair brackets the problem, because spawn distance controls BOTH
# threat density and reaction time when leading is off:
#     v5 @3  spawn 7-10 m   1.4-2.0 s flight  0.80 threats/ep  control 35.0%  oracle cleared 85.7%
#     v6 @3  spawn 4-5.5 m  0.8-1.1 s flight  1.75 threats/ep  control  0.0%  oracle cleared 24.2%
# Long flight leaves time to dodge but the throws miss; short flight makes
# them connect but leaves no time to react. No spawn distance gives both.
#
# Leading decouples them: the throw connects because it is aimed where the
# vehicle WILL be, not because it arrives too fast to avoid. v7 turns leading
# on and keeps a 5.5-7.5 m spawn (1.1-1.5 s flight), well above the 0.63 s a
# 0.30 m dodge needs at 1.5 m/s^2.
#
# The known risk, recorded by whoever set this to 0.0: "aiming at all is what
# made position itself a strategy". A led throw tracks a held offset, so
# constant offsets stay defeated (unlike v2/v3, where one offset cleared
# everything) -- but any sufficient MOVEMENT after launch evades, so
# direction carries no information and only TIMING does. Whether timing alone
# is learnable is the open question; oscillator_baseline.py is the falsifier,
# and it must be run at a density where the ORACLE succeeds, which v4 was not.
#
# Measured at max_concurrent 3 (set below):
#     control  5.0% episode, 0.0% of threats cleared
#     oracle  30.0% episode, 39.3% cleared
#     1.55 threats/ep, 1.45 bystanders (52% threat fraction)
# First dynamic config of the session with BOTH a low passive floor and a
# real oracle advantage (+25 points). The oracle's 39.3% is lower than the
# physics suggests -- clearing 0.30 m takes ~0.64 s at 1.5 m/s^2 with the
# 0.8 m/s rate cap, against 1.1-1.5 s of flight -- so the expert may not be
# committing early enough. Worth checking before reading too much into the
# gap.
#
# Gate, feasibility FIRST: oracle high, then control low, then blind
# baselines (constant offsets AND weaves).

# Dynamic dodging, v5: fewer obstacles, nearly all of them real threats.
#
# The v4 density sweep found no usable operating point -- the oracle degraded
# faster than the control floor fell, so the gap shrank monotonically and
# inverted:
#     concur  control  oracle  oracle_cleared  threats/ep  bystanders/ep
#          2    50.0%   80.0%           87.5%        0.40           1.60
#          4    40.0%   55.0%           69.2%        0.65           3.35
#          8    10.0%   20.0%           44.4%        1.35           6.65
#         16     5.0%    0.0%           39.4%        3.05          12.75
# Obstacles outnumbered genuine threats 4:1, so raising density bought a
# little threat and a lot of clutter: the passive floor fell slowly while the
# oracle's room to maneuver collapsed.
#
# Cause, measured rather than guessed: aim_scatter_m 0.4 samples uniformly in
# a sphere, and against the 0.30 m combined hit radius only 42% of throws are
# aimed to hit at all. The other 58% are bystanders by construction --
# obstacles that constrain the dodger without ever threatening a passive
# vehicle. At scatter <= 0.30 every throw is aimed within the hit radius.
#
# v5 therefore lowers scatter to 0.25 (all throws aimed to hit, but not all
# identical) and drops max_concurrent 16 -> 5. The intent is ~3 genuine
# threats per episode with ~1 bystander, instead of 3 threats buried in 13.
# Density comes from the threat FRACTION, not the obstacle count.
#
# Gate before training, in this order -- feasibility FIRST:
#   1. oracle episode success high (v4 at 16 concurrent was 0%: nothing
#      solved it, which made every blind baseline uninterpretable)
#   2. control low
#   3. only then blind baselines: constant offsets AND oscillating weaves,
#      since a drone-aimed config defeats constants but may fall to a weave
#
# Note the measurement limit inherited from drone-aiming: because throws are
# aimed at wherever the vehicle actually is, there is NO policy-independent
# threat set -- a weaving policy drags throws off the nominal path and simply
# reduces the count (measured: 3.20 threats/ep for control, 0.64 for a 1 Hz
# weave). Clearance rates are therefore not comparable across arms here;
# episode success and bystander hits are.

# Dynamic dodging, v4: drone-aimed throws at v2's density.
#
# Why not v2/v3 (nominal-aimed): throws all converge on the nominal path, so
# stepping off it defeats everything. Measured -- best constant displacement
# clears 0.991 (v2) / 1.000 (v3), 85% / 100% of episodes fully cleared by ONE
# offset, const-0.80 clears 98.8% of threats. Worse, the privileged oracle
# scored 35.8% against that arm's 98.8%, because the oracle RETURNS to the
# nominal path and that is precisely where the throws are aimed: the task
# inverts the incentive between dodging and recovering.
#
# Walls do not rescue it. With every termination active, const+0.80 scored
# 43.3% against 40.0% with terminations disabled -- wall strikes rose to 23%
# but merely replaced obstacle collisions, leaving net success unchanged.
# (const+/-1.20 collapses to tracking_failure in 20-24 of 30 episodes, so the
# controller, not the geometry, bounds the offset.)
#
# v4 returns to drone-aimed throws, where a held offset cannot work because
# each throw is solved against wherever the vehicle actually is at spawn --
# and keeps v2's density fixes (12 s episodes, 0.4 m scatter) that took v1
# from 0.65 genuine threats/episode to ~3.
#
# The honest limitation: evading a throw aimed at your current position needs
# only movement AFTER launch, so DIRECTION carries no information. What it
# does require is TIMING -- moving when a throw is actually incoming -- and
# timing is perceptual. v4 is therefore a bet that timing alone is a real
# task, which oscillator_baseline.py is written to falsify: a blind
# sinusoidal weave moves constantly without seeing anything, so if it matches
# the oracle, timing is not informative either and this direction is finished.
#
# v1's other exploit, braking, is NOT addressed here (v1 along-track escape
# 0.437 with zero braking-immune encounters). If v4 survives the oscillator
# test, removing the along-track degree of freedom is the next change.

# Dynamic dodging, v2: a task that actually poses the problem.
#
# Measured on v1 with the escape-set probe (pure geometry, 20 seeds):
#   genuine threats to the nominal path : 0.65 per episode
#   escape fraction (blind-guess success): 0.658, tight (p10 0.64, p90 0.71)
# So most episodes required no dodge at all, and two thirds of the ones that
# did were cleared by an arbitrary displacement. A blind policy scores about
# 0.66^0.65 ~ 77% without using perception -- which is why four separate
# blind ablations came back null. There was almost nothing to learn.
#
# Three changes, each aimed at one term in that number:
#
#  1. deterministic_obstacle_aim: throws aim at the seed-determined NOMINAL
#     path rather than the live drone. This is NOT the aimed-obstacle
#     degeneracy that v1's comments warn about: that one aimed at the DRONE,
#     so the threat formation followed it and any displacement evaded. Aiming
#     at the nominal path fixes the crossing point, so evasion requires
#     knowing WHERE the throw will cross -- direction carries information.
#  2. aim_scatter_m 1.5 -> 0.4: with 1.5 m of scatter against a 0.30 m hit
#     radius most throws simply missed. Low scatter is only degenerate when
#     combined with drone-aiming, which (1) removes.
#  3. episode_seconds 6 -> 12: 0.65 threats/episode was partly just a short
#     window. Twice the flight time is twice the encounters.
#
# Re-measure with escape_set_probe.py before training on this. The target is
# 3-5 threats/episode with the escape fraction well below v1's 0.658 -- and
# if the escape fraction instead goes UP, the change has made the task more
# degenerate, not less, and must be reverted.

# SINGLE-OBSTACLE, SHORT-WINDOW VARIANT (v4). v3 with the vehicle's
# acceleration and rate limits raised, which the earlier "user-specified
# constraint" on offset_accel_limit_mps2 had been blocking.
#
#   offset_accel_limit_mps2   1.5     -> 5.0
#   offset_rate_limits_mps    1.5/1.0 -> 2.5/1.5
#   obstacle speed            6.5     -> 10.0 m/s
#
# Net effect: the dodge itself takes 0.52 s instead of 0.83 s, so the
# reaction window can drop to 0.70-0.90 s (from v3's 1.08-1.38 s, and v2's
# 1.10-1.50 s) while staying feasible. 10 m/s obstacles are the regime
# Falanga et al., Science Robotics 2020 demonstrate, so this is a documented
# target rather than an arbitrary one.
#
# THE RISK IS THE VEHICLE, NOT THE TASK. 5.0 m/s^2 lateral is a 27-degree
# bank, and this repo has a documented tip-over history. The gate must be
# read for tracking_failure and out_of_bounds terminations, not just success:
# if the vehicle cannot hold the path under these limits, the numbers are
# meaningless no matter how good the success rate looks.
#
# GATE RESULT (2026-08-30, 40 episodes per arm, one arm per process):
#
#   arm                 return   success   terminations
#   control              -78.1     15.0%   26 obstacle / 14 timeout
#   const+0.40          -103.9     15.0%   26 obstacle / 14 timeout
#   const+0.80          -131.8     17.5%   23 obstacle / 17 timeout
#   weave0.4@0.5Hz       -76.9     20.0%   24 obstacle / 16 timeout
#   weave0.8@0.5Hz       -73.1     30.0%   21 obstacle / 19 timeout
#   oracle               +10.1     62.5%    3 obstacle / 37 timeout
#
# There were ZERO tracking_failure and out_of_bounds terminations in every
# arm: the vehicle passes the authority-risk check. The gate for a learned
# policy is therefore beat -73.1 return AND 30.0% success, each blind arm on
# its strongest metric. The oracle clears both by +83.2 return and +32.5
# success points, so privileged-policy training is justified.
#
# ORACLE FOLLOW-UP (2026-09-01, same gate seeds): no tested planner edit
# improved both objectives, so the original oracle remains the baseline.
#
# Diagnostics:
#   plan attempts                 108 made / 306 failed = 73.9% failure
#   collisions                    1 with a plan, 2 with no plan
#   predicted / achieved clear    +0.284 / +0.142 m median
#   prediction-achievement gap    +0.127 m median
#   failed-attempt rejects        47.9% speed, 31.3% static, 20.8% moving
#   commit lead                   0.37 s median vs 0.53 s required; 81% late
#   direction flips               0% of 26 encounters
#   worst controller tracking     0.362 m command / 0.361 m achieved,
#                                 0.009 m error, 18.9 deg tilt
#
# The vehicle/controller is not the limit. Timing is late, but advancing the
# peak did not improve the full objective:
#
#   peak advance       return   success   obstacle collisions
#   0.00 s (original)   +10.1     62.5%          3
#   0.15 s               +8.5     70.0%          4
#   0.25 s               +8.6     65.0%          4
#   0.35 s               +8.2     60.0%          4
#
# Adding lower 0.25/0.30 m candidates also failed: +9.0 return, 62.5%
# success, 4 collisions, and 23 minutes for 40 episodes versus ~16 minutes
# for the original menu. Do not select either change for BC collection.
#
# SINGLE-OBSTACLE VARIANT (v3) -- v2's discount/reward fixes plus a task
# change: one obstacle at a time, faster, thrown from further out.
#
# Rationale is measured, not stylistic. oracle_prediction_probe.py found the
# expert's planner fails 84.7% of its attempts and that HALF its collisions
# are on obstacles it never planned for -- both driven by having to clear
# three obstacles simultaneously with one quintic. The oracle is the teacher
# the entire BC route depends on, so its ceiling is the project's ceiling.
#
# What is NOT changed, and why: throws still lead the vehicle
# (lead_aim_probability 1.0). Aiming at the quad's CURRENT position was
# considered and is arithmetically impossible here -- a dodge takes ~0.83 s,
# during which the quad travels 3.0 m/s * 0.83 = 2.5 m, i.e. 8x the 0.30 m
# contact radius, so an unled throw misses by construction. Making the throw
# fast enough not to need lead (t_flight < 0.30/3.0 = 0.1 s, i.e. ~55 m/s)
# makes it undodgeable by the same factor. An earlier config already set
# lead_aim_probability 0.0 and produced exactly this: throws aimed where the
# vehicle no longer was. Leading is forced by quad_speed * reaction_time
# greatly exceeding contact_radius, not chosen.
#
# Observation is 18 + 1 slot x 12 = 30 dims.
#
# GATE MUST BE RE-MEASURED. Obstacle count, speed and spawn distance all
# changed, so neither v2's gate (-28.2 return / 32.5% success) nor its oracle
# ceiling (52.5%) applies. Run return_baseline.py on THIS config first --
# oracle feasibility, the do-nothing floor and both blind arms -- before
# training anything against it.
#
# PRECONDITION TEST v2 -- v1 plus the two reward/discount changes that the
# EV measurements showed were blocking learning. See the gamma and
# crash_penalty_per_remaining_step comments below for the evidence.
#
# v1 ran 758k steps at eval success 15-20% (below the 32.5% blind arm) with
# explained_variance oscillating around zero, on a lossless Markov obstacle
# channel. That is exactly what a ~0 causal EV ceiling predicts.
#
# WARNING: crash_penalty_per_remaining_step: 0.0 CHANGES EPISODE RETURNS, so
# the section 3 gate numbers (-79.3 return / 32.5% success) no longer apply
# to this config. Re-run return_baseline.py on it before comparing anything.
# Success rates are unaffected by the reward change and remain comparable.
#
# PRECONDITION TEST -- not a policy we intend to deploy.
#
# Identical to v20 in task, rewards, obstacles and control. The ONLY changes
# are who sees what: the actor is handed ground-truth nearest-obstacle
# geometry (privileged_actor: true) and the event camera is switched off
# entirely (obs_mode: state).
#
# Why this exists. Every system in the literature review (HANDOFF section 6)
# decouples perception from control, and every one of them has a control
# module that solves the task from clean obstacle state BEFORE any perception
# is attached. arXiv 2603.07578's teacher is PPO on privileged state and
# scores 1.00; its BC student then retains 0.80 of that. Our teacher is a
# hand-designed quintic planner scoring 0.525, so a student retaining 80%
# lands at ~0.42 against a 0.325 blind baseline -- inside the noise band, for
# reasons that have nothing to do with perception. Cloning that expert cannot
# produce a measurable perception result.
#
# So the question this config answers is the precondition, not the product:
#   can ANY policy solve this task given perfect obstacle knowledge?
#
# DECISION CRITERIA, PRE-REGISTERED before the run produced a number. This
# project has twice reached a conclusion by reading a curve after the fact --
# see the total_timesteps comment below, where every plateau called during
# v14 turned out to be premature, and the v20/v21/v22 "decline" that was
# attributed to actor updates and then reproduced with the actor frozen.
#
#   PASS (usable teacher)      success >= 0.80 at any eval.
#       Clone it. The reference's BC student retains ~80% of its teacher, so
#       0.80 projects to ~0.64 -- comfortably clear of the 0.325 blind arm.
#
#   WEAK PASS (0.55 - 0.80)    privileged control works but not well.
#       Diagnose before cloning: a 0.60 teacher projects to ~0.48, which
#       beats 0.325 but not by enough to survive this task's eval noise
#       (the v7 policy scored 1/8 on one seed batch against 13/40 on a wide
#       sweep). Report both return AND success -- weave0.4 wins on return
#       while weave0.8 wins on success, and scoring on success alone
#       produced a full day of wrong conclusions in an earlier session.
#
#   FAIL (<= 0.35)             indistinguishable from the 0.325 blind arm.
#       The finding is then about the TASK, not perception. Every event-based
#       result from v16 on was measuring a ceiling, and the correct next move
#       is to redesign the task -- not to train another encoder.
#
#   The floor to beat is the GATE, not zero. RE-MEASURED ON THIS CONFIG
#   (return_baseline.py, 40 episodes, outputs/rl/gate_v2_rerun.log), because
#   crash_penalty_per_remaining_step: 0.0 changes episode returns:
#
#     arm              v1 return   v2 return   success
#     control            -124.3      -59.1      12.5%
#     const+0.40         -143.0      -78.7      15.0%
#     const+0.80         -186.1     -119.6      15.0%
#     weave0.4@0.5Hz      -79.3      -28.2      17.5%   <- best blind, RETURN
#     weave0.8@0.5Hz      -99.5      -40.2      32.5%   <- best blind, SUCCESS
#     oracle              -10.6      +19.0      52.5%
#
#   EVERY success rate and every termination count is unchanged from v1, so
#   the reward edit rescaled scoring without perturbing a single episode
#   outcome. That is why the success thresholds above stand as written.
#
#   GATE FOR THIS CONFIG: beat -28.2 return AND 32.5% success -- each blind
#   arm on its own strongest metric. A privileged actor that cannot beat a
#   blind sine weave has not demonstrated its information is usable at all.
#
#   Note the oracle is the only arm with POSITIVE return here (+19.0), and
#   its margin over the best blind arm narrowed from +68.7 to +47.2 return
#   while holding +20 points of success.
#
# WHEN TO CALL IT. Not before 2M steps. v14 ran 13.2 / 9.0 / 23.0 / 26.6%
# by quarter -- a back-half slope of +7 points per 1M after looking flat and
# even regressing through the first half. Call a plateau only when the slope
# over the last 1M steps is under +2 points, and never off a single eval:
# eval is 40 episodes, so a one-eval swing of +/-0.07 is one standard error.
#
#   reaches ~1.0  -> the task is sound, and this becomes the BC teacher in
#                    place of the geometric planner. The planner's specific
#                    failure (see below) is then irrelevant rather than
#                    something to tune.
#   plateaus ~0.5 -> the finding is about the TASK, not about perception, and
#                    every event-based result from v16 on was measuring a
#                    ceiling rather than a perception gap. That would be the
#                    single most important thing this project could learn.
#
# Note the config named velocity_dodge_privileged_baseline.yaml is NOT this
# test despite its name -- it has privileged_actor: false, obs_mode: combined.
# The name is a fossil. This is the first privileged-ACTOR run on the task as
# corrected by commit 5225691 and the v20 parameter fixes.
#
# What the geometric planner's failure looks like, for comparison (measured
# 2026-08-29, oracle_commit_probe + oracle_magnitude_probe on v20):
#   required displacement   median 0.28 m, max 0.35 m over 16 encounters
#   commit lead             median 0.85 s against 0.64 s required, 0% late
#   direction flips         0%
#   ACHIEVED by closest approach   median 0.23 m  <- 0.05 m short
# It commits in time, picks a side and holds it, and still undershoots: it
# plans to the geometric minimum and the actuation chain delivers ~78% of
# command. safety_margin_m guards the PREDICTED clearance, not execution
# error. A closed-loop learned policy is trained against realised dynamics
# and does not need that margin hand-set.
seed: 42
# 8 -> 16. obs_mode: state skips event accumulation entirely
# (env.py: events_accum = self.obs_mode != "state"), so there is no render
# cost per step and no per-worker GPU event buffer -- the throughput limit
# that forced 8 elsewhere does not apply here.
num_envs: 16
# 4M: v14 (2M) never converged -- success by quarter ran 13.2 / 9.0 / 23.0
# / 26.6%, a back-half slope of +7 points per 1M steps. Every "plateau"
# called during that run was premature.
total_timesteps: 4000000
# 2, with envs_on_gpu0: 0 below -- v20's proven layout. The learner keeps
# GPU 0 and every worker goes to GPU 1, which matters more now that 16
# training workers and 8 eval workers coexist (~950 MiB of habitat context
# each even with obs_mode: state, which still needs a GL context for scene
# geometry and collision).
n_gpus: 2
# 6 -> 0. Three OOMs came from GPU 0 holding BOTH the learner and most of
# the Habitat workers: main process 18.31 GiB plus six workers at ~820 MiB
# each is 23.2 of 23.55 GiB, while GPU 1 sat at 3.3 GiB. Shaving n_steps was
# treating the symptom. All render workers go to GPU 1; the learner keeps
# GPU 0 to itself.
envs_on_gpu0: 0
eval:
  # Halved in frequency (was 16384) now that the budget is 2M and each eval
  # runs 40 episodes: at the old cadence that is ~122 evaluations, enough
  # blocking eval time to rival the training it is measuring.
  freq: 32768
  # Raised from 30: success here is a bursty, low-probability event, and
  # small-n eval has repeatedly misled this project -- the v7 final policy
  # scored 1/8 on one seed batch against 13/40 on a wide sweep. Any number
  # quoted as definitive needs a wide, disjoint seed range.
  episodes: 40
  # 1 -> 8. MEASURED on the first attempt at this run: between 28672 and
  # 32768 steps time_elapsed went 554 -> 987 s, of which only ~80 s was
  # training -- a single 40-episode eval costs ~353 s single-env. At
  # freq 32768 over a 4M budget that is 122 evals x 353 s = ~12 h of blocking
  # evaluation against ~22 h of training. The comment above already worried
  # about eval time "rivalling the training it is measuring"; it does.
  #
  # The fix is to parallelise eval, not to thin it out -- episodes stay at 40
  # because small-n eval has repeatedly misled this project (the v7 policy
  # scored 1/8 on one seed batch against 13/40 on a wide sweep). The eval
  # env is a real SubprocVecEnv (train_sb3.py builds eval_num_envs workers,
  # each seeded base_seed + 1000 with a distinct env_idx), so this is a
  # throughput change only.
  #
  # NOTE the eval episode SET changes with this number, since episodes are
  # drawn across 8 seed streams instead of 1. These eval numbers are a
  # training curve, not a gate result -- the gate is measured separately and
  # reproducibly by return_baseline.py.
  #
  # RESULT, measured after the change: 353 s -> 239 s. That is 1.5x, NOT the
  # 8x that 8 parallel envs implies, and the shortfall is worth understanding
  # before anyone tunes this again.
  #
  # Each env runs at ~3.2 policy-steps/s NO MATTER HOW MANY ARE RUNNING --
  # 16 training envs give 51 fps, i.e. 3.2 each; one eval env gave the same.
  # The env is single-thread-bound per worker, not contention-bound (the host
  # has 80 cores and load sits near 5 during eval). So 40 episodes over 8
  # envs is 5 SEQUENTIAL episodes per env: 5 x 150 steps / 3.2 = ~234 s,
  # which is what was measured.
  #
  # Consequences for anyone optimising this further:
  #   * eval cost scales as ceil(episodes / num_envs), not as 1/num_envs.
  #     Going 8 -> 20 would give ~94 s, but 20 more workers at ~800 MiB of
  #     habitat context would not fit beside the 24 already on the GPU.
  #   * raising eval freq is the free lever (no memory cost); 65536 halves
  #     the overhead and still leaves 61 curve points over a 4M budget.
  #   * for TRAINING throughput the tempting move is num_envs 16 -> 32 with
  #     n_steps 256 -> 128 to hold the rollout at 4096. Do not: v16 ran
  #     n_steps 128 and v17 moved to 256 precisely because the rollout must
  #     exceed the episode length for GAE, taking EV -0.14 -> +0.05.
  num_envs: 8
vec_env:
  type: auto
  start_method: spawn
env:
  # Controller runs at control_rate (100 Hz); the policy is queried
  # every Nth controller update, so 2 -> 50 Hz decisions. Slowing the
  # controller itself instead cost attitude-loop phase margin and the
  # vehicle intermittently tipped over and fell.
  # 5 -> 20 Hz decisions (controller still 100 Hz). At 50 Hz the config's own
  # use_sde note records the problem: i.i.d. exploration "reaches only ~11% of
  # the displacement a sustained action would", which gSDE was then added to
  # work around. A slower decision rate fixes that directly. It also cuts the
  # credit-assignment horizon from 750 steps/episode to 300 for a dodge that
  # occupies ~7 of them, and accumulates 50 ms of events per decision instead
  # of 20. Cost is 50 ms of reaction latency against a ~250-350 ms usable
  # detection window. Slowing the *controller* is what previously cost
  # attitude phase margin; this leaves it untouched.
  policy_decimation: 5
  # state, not combined: this run deliberately removes perception from the
  # problem. No events are accumulated or rendered.
  obs_mode: state
  # 10 s at the scattered density gives 4.3 encounters/episode (measured,
  # zero-action): success stays conjunctive but sensitive (0.63 at p=0.9 per
  # encounter, vs 0.56 at 15 s), and 201 steps/episode against the old 750
  # is most of the credit-assignment gain the 20 Hz change was for.
  episode_seconds: 12.0
  deterministic_obstacle_aim: false
  init_speed_range:
  - 0.0
  - 0.0
  safety:
    enable_navigable_check: false
  event_representation:
    model: time_surface
    log_compression: 1.0
    downsample_factor: 1
    # Matched to the 20 Hz decision period (50 ms). At 10 ms the surface
    # decayed to nothing within a fifth of a control step, so most of the
    # interval between decisions contributed nothing to what the policy saw.
    #
    # A 10->60 ms test under the *old* aimed obstacles made contrast worse
    # (event mass 82k->239k but threat-vs-quiet ratio 1.118->1.014): a
    # constant-bearing obstacle barely moves on the image plane, so longer
    # integration added background egomotion and almost no signal. Scattered
    # throws cross the field of view instead, accumulating a coherent streak
    # at a velocity distinct from the background -- so that result is
    # evidence about the old geometry, not a general law. Re-measure it.
    ts_decay_ms: 50.0
    # Stack 4 frames = 200 ms of context at the 50 ms control period. A single
    # time surface shows WHERE edges fired, not how fast the obstacle is
    # closing, so distance and time-to-impact are not recoverable from one
    # frame -- which is why the depth-regression aux head could never beat its
    # baseline. Recurrence was the better answer in principle and is what the
    # reference uses, but sb3-contrib's RecurrentPPO retains ~282 MiB per
    # update (constant per update, not batch-proportional: identical at 8 and
    # 4 envs), so no configuration survives a long run.
    #
    # ts_decay_ms stays 50 to match: frames are one control period apart, so a
    # 50 ms window tiles time with no gaps. A shorter window sharpens each
    # frame (peak_z 5.90 at 5 ms vs 5.20 at 50 ms) but discards the events
    # falling between frames -- 70% of them at 15 ms.
    history_frames: 4
    sensor_uuid: null
  task:
    name: velocity_dodge
    config:
      # 0.25, down from 0.5. Measured directly: the privileged oracle earns
      # LESS total reward than doing nothing (-347.2 vs -315.0 per episode)
      # while succeeding 2.5x as often. It gains +100.9 by crashing less and
      # pays -122.3 in tracking penalty for the displacement its dodges
      # require -- so under the old weight, dodging competently was a losing
      # trade and every policy correctly learned to stay near-passive. That
      # is the common cause behind the whole v14-v18 sequence, not the
      # separate optimisation failures each run appeared to show.
      # Break-even is w_pos = 0.327; 0.25 leaves real margin.
      w_pos: 0.25
      # 0.15, between the original 0.3 and the 0.0 that replaced it, both
      # of which failed in opposite directions:
      #   0.3 made any displacement up to 0.3 m free, and v7 converged on
      #   exactly that loophole -- a permanent ~0.35 m standing offset with
      #   no threat modulation at all (0.345 m with obstacles *disabled*
      #   vs 0.340 m during real threats), scoring 13/40 against a
      #   do-nothing baseline's 14/40.
      #   0.0 then priced *every* metre of pos_error, including the
      #   controller lag and transient excursion a genuine dodge cannot
      #   avoid. Measured on v8: -0.526 reward/step, so a full 751-step
      #   survival scored -395 against -161 for crashing at step 192 --
      #   the policy was paid 234 to die early, and did.
      # Now 0.0. A 3-arm probe resumed from the same v11 checkpoint
      # (150k steps each: no change / deadband 0.0 / w_clearance 2.0)
      # measured the standing offset with obstacles *disabled* at 0.654
      # unchanged, 0.572 here, and 0.600 for the clearance arm -- so
      # neither term is what produces the offset. But this arm survived
      # 321 steps against the unchanged arm's 250 (do-nothing is 256), so
      # it earns its place on survival even though it does not remove the
      # offset. Safe now in a way it was not at v8: w_survival is 0.10
      # rather than 0.02 and the crash penalty scales with forfeited time,
      # so quiet tracking still nets about +0.055/step.
      w_pos_deadband_m: 0.0
      # 0.08, down from 0.25 -- the term that actually punished dodging.
      # Halving w_pos alone did NOT flip the ordering (oracle -313.3 vs
      # do-nothing -312.6, still tied), because r_track bundles position
      # AND velocity error and only the position half moved. Separating the
      # two from measurements at w_pos 0.5 and 0.25 shows why: the oracle
      # accumulates a velocity-error sum of 254 against the passive
      # policy's 18, so a dodge is penalised ~14x more through velocity
      # than the thing it is avoiding costs. At 0.08 the oracle finally
      # scores above passive by ~40 per episode.
      w_vel: 0.08
      # Deliberately NOT raised alongside the deadband removal: this term
      # prices correction *energy*, which a genuine transient dodge spends
      # just as hard as the degenerate standing offset did, so raising it
      # taxes the behaviour we want. The deadband removal above already
      # separates the two by an order of magnitude on its own.
      w_correction: 0.02
      w_smooth: 0.01
      # Raised from 0.02, which was far too small to make staying alive
      # worth its own tracking cost: with competent tracking inside the
      # deadband above, each step is now worth about +0.075 net, so a full
      # episode of survival earns ~+56 instead of bleeding reward.
      w_survival: 0.10
      w_along_track: 1.0
      # Explicitly answers "get back on the path when nothing is inbound".
      # This could not work before: the drone was flagged in-threat on
      # 96.2% of steps at the old obstacle density, so there was barely a
      # no-threat condition to reward -- and with threat nearly always on,
      # a permanent offset was very close to the correct policy, which is
      # exactly what every run converged to. At the reduced density it is
      # 73% / 27%, so this term now applies on roughly a quarter of steps.
      # Now priced on pos_excess (the actual deviation) rather than the
      # commanded offset. Measured on v24: no-threat steps ran pos_error
      # 1.633 m against an offset_cmd of 0.280 m, so the old form charged
      # 17% of the excursion and left the standing-offset exploit -- which
      # lives in the other 83% -- completely free. Weight retuned for the
      # ~6x larger quantity it now multiplies; see outputs/rl/no_threat_gate.json
      # for the oracle-vs-nominal-vs-wander sweep that set it. Over 20
      # episodes the oracle's margin over passivity erodes only 11% across
      # the whole sweep (+163.6 at w=0 to +145.9 at w=0.5), so dodging still
      # wins everywhere; 0.3 keeps 94% of that margin (+153.0) while adding
      # +22 to the margin over a wandering arm. Charges ~0.49/step on the
      # measured 1.63 m no-threat deviation, all of it escapable by
      # returning to the path.
      w_no_threat_offset: 0.3
      # Braking removed: the correction is lateral + vertical only. The
      # policy was spending ~36% of in-threat steps at FULL reverse with a
      # near-zero mean forward command -- bang-bang braking, which is also
      # what made the motion look like inching. Measured cost to a
      # privileged oracle on this exact config: 43.3% -> 36.7% success, so
      # braking is genuinely load-bearing for an optimal planner, but only
      # worth 6.6 points, and our policies have never come near that
      # ceiling anyway. In exchange the action space collapses from 3
      # meaningful axes to 2 and the forward oscillation disappears.
      # Headroom above the 5.0% do-nothing control is still 31.7 points.
      lateral_only: false
      # Stricter still: left/right only, zeroing vertical as well. Measured
      # cost to the privileged oracle is 46.7% -> 43.3% (n=30, inside
      # noise), so the vertical axis is nearly free to give up -- and it
      # was the axis the policy abused, since obstacles skewed upward made
      # a blanket duck profitable for a long stretch of this project. What
      # remains is a single scalar: the smallest action space that can
      # still express a dodge.
      lateral_axis_only: false
      # Lowered from 8.0. In the same 3-arm probe this arm survived 327
      # steps against 250 for the unchanged reward -- the best of the
      # three -- while trimming the standing offset from 0.654 to 0.600.
      # At 8.0 the shaping plausibly paid for permanent displacement
      # (a constant offset raises average clearance from a dense field)
      # by more than the tracking term charged for it.
      w_clearance: 2.0
      clearance_threshold_m: 1.5
      gamma_shaping: 0.994
      # Was unset (defaults to 0.0): the potential-based clearance shaping
      # below is 0 both before and after an encounter, so it telescopes to
      # ~0 net reward over a full clean dodge -- it only ever punishes
      # proximity, never rewards successfully surviving it. With no direct
      # payoff for clearing an obstacle, the only thing discouraging a
      # crash was the terminal -60 penalty: sparse, delayed, and hard to
      # credit-assign through a CNN that hasn't learned to see obstacles
      # yet. This is a dense, promptly-attributable reward fired the
      # instant a threat is confirmed cleared.
      # v18: 8.0 -> 30.0. At 8.0 the MARGINAL economics of dodging harder are
      # negative, which is the point -- not the gross total, which merely
      # looks lopsided. During a threat w_no_threat_offset is gated ~off by
      # threat_proximity, so an extra metre of cross-track deviation costs
      # w_pos=0.25/m/step over a ~30-step (1.5 s) encounter, i.e. ~7.5. It
      # earns 8.0 only if that metre flips an encounter from fail to clear --
      # but v17 measured encounter_clear_rate already at 0.68 WITHOUT
      # dodging, so the expected payoff is 8.0 * delta_p(clear), well under
      # the 7.5 it costs. Dodging harder was a net loss in expectation, and
      # authority_used_in_threat pinned at 0.152 is the policy correctly
      # solving the objective it was given.
      #
      # 30.0 puts the payoff at 30 * delta_p against the same ~7.5, so a
      # deviation that buys even a 25% improvement in clear probability pays
      # for itself. w_along_track is deliberately NOT relaxed alongside this:
      # it prices braking-as-evasion, the exploit this task is most exposed
      # to (a ballistic obstacle solved for a fixed arrival time simply
      # misses if you lag), and gating it during threat windows would reopen
      # exactly that. The intended dodge is cross-track, which w_along_track
      # does not charge.
      #
      # Watch encounters_total, not just encounters_cleared: the encounter
      # denominator is endogenous (an obstacle counts only if it came within
      # clearance_threshold_m), so a large per-clear bonus could in principle
      # be gamed by hovering near threats to farm them. If encounters_total
      # climbs against v17's flat ~2.45, that is the failure mode.
      w_encounter_clear: 30.0
      # New: obstacles get dense potential-based shaping the whole way in
      # (w_clearance above), but the scene boundary previously only had a
      # sparse terminal penalty on out_of_bounds -- v3 (600k steps) showed
      # this gap directly: encounter_clear_rate rose and held at ~60-70%
      # (up from v2's flat 35-55%), confirming the exploration fix worked,
      # but out_of_bounds terminations *worsened* over the run (2/6 -> 3/6
      # between the 131k and 278k checkpoints, confirmed on video both
      # times) as evasive corrections grew large enough to exit the scene
      # with no graduated feedback on the way there. Same potential-based
      # construction as w_clearance, aimed at the boundary instead.
      w_boundary: 8.0
      boundary_margin_threshold_m: 1.0
      # Raised from 60: at that level a crash was cheap enough that ending
      # the episode early beat paying per-step tracking cost to keep
      # flying (v8: crashing at step 192 scored -161 against -395 for
      # surviving to 751). 150 keeps dying decisively worse than living
      # even in an episode spent mostly dodging.
      crash_penalty_scene: 150.0
      crash_penalty_obstacle: 150.0
      # Charges a crash for the episode it forfeits, on top of the flat
      # penalties above. 0.6/step comfortably out-prices the worst per-step
      # rate either failed run produced (-0.51), putting the break-even at
      # r < -0.85 instead of v9's -0.25, so exploration noise can no longer
      # make dying the profitable move. See VelocityDodgeTask.crash_penalty.
      # 0.6 -> 0.0. This term is literally proportional to remaining episode
      # length, so it wires the exact quantity that swamps the return
      # (corr(return, length) = +0.958) straight into it. At a typical
      # collision -- step 26 with 131 remaining -- it charges 0.6 * 131 = 79
      # on top of the flat 150, i.e. the dominant term in the whole reward.
      #
      # Its stated purpose (see VelocityDodgeTask.crash_penalty) was to stop
      # a self-reinforcing failure where dying becomes profitable as episodes
      # shorten: the flat penalty erodes relative to the per-step deficit.
      # That argument is horizon-dependent and does not survive gamma 0.97.
      # With a 33-step horizon the discounted value of continuing is at most
      # ~33 * 0.42 = 14 (measured per-step net under zero action), against a
      # flat crash penalty of 150. Dying cannot be profitable by an order of
      # magnitude, so the length-scaling is no longer buying anything.
      #
      # Keep watching it: if r_survival-style per-step credit ever goes
      # net-negative under a bad policy, re-derive the bound rather than
      # restoring this term, since restoring it reinstates the pathology.
      crash_penalty_per_remaining_step: 0.0
      # v20: 0.02 -> 0.10, set from the measured oracle distribution rather
      # than from geometry.
      #
      # NOTE the units, which are easy to get wrong: `clearance` is
      # SURFACE-TO-SURFACE, not centre-to-centre. env_reactive_dodge.py
      # computes it as norm(rel_pos) - (agent_radius + collision_radius), so
      # the 0.30 m contact distance is ALREADY SUBTRACTED and clearance == 0
      # IS contact. dodge_clearance_m 0.02 therefore meant "missed by >= 2 cm"
      # -- a genuine miss, just a razor-thin one. It was never scoring
      # collisions as clears.
      #
      # A first attempt at 0.35 (reasoned from the 0.30 m contact distance,
      # before checking the units) failed the oracle gate outright: 1/40
      # episodes, 2.5%. That reproduced exactly what the note this replaces
      # warned about for 0.1 on the old control path -- a threshold above
      # what the expert can achieve pins success near zero for reasons
      # unrelated to learning.
      #
      # Measured instead, 40 privileged-oracle episodes at v20 dynamics:
      #     min_clearance  p25 -0.021   p50 0.076   p75 0.152   p90 0.183
      #     obstacle_collision in 12/40 episodes (30%)
      #     fraction of episodes above threshold:
      #        0.02 -> 65.0%   0.05 -> 60.0%   0.10 -> 37.5%
      #        0.15 -> 27.5%   0.20 -> 10.0%   0.35 ->  2.5%
      # At 0.02 the bar sits just under the 70% non-collision ceiling, so it
      # was effectively measuring "did not collide" and gave no gradient
      # toward any margin at all. 0.10 asks for a real one while staying
      # inside what the expert demonstrably reaches.
      #
      # 0.10 REDEFINES success, so it invalidates every prior benchmark --
      # the 0.696 clear rate, the -122.1 blind sine weave and the 61.7%
      # oracle were all measured at 0.02. Re-run the gates before reading
      # any of them again.
      #
      # NOTE (2026-08-29): the note that used to sit here called the
      # oracle's 0.295 m median peak_cross_track evidence that the expert
      # "has not scaled to the raised limits". Measured since
      # (oracle_magnitude_probe.py): the smallest displacement that actually
      # clears is median 0.28 m and never exceeds 0.35 m, so 0.295 m is
      # correct minimum-sufficient behaviour, not under-scaling. The expert's
      # real shortfall is that it ACHIEVES only 0.23 m of that command by
      # closest approach.
      dodge_clearance_m: 0.10
      # false here, and NOT an oversight. Asymmetry exists so a blind actor
      # can be trained against a sighted critic; with privileged_actor: true
      # the actor already sees this exact 9-D channel, so a separate critic
      # channel would be the same information twice. Setting it false keeps
      # the observation a plain Box, which selects SB3's stock MlpPolicy
      # (build_policy_config: obs_mode == "state" -> "MlpPolicy") instead of
      # the project's AsymmetricActorCriticPolicy. That matches the
      # reference's state teacher and removes the custom policy, the event
      # extractor and the dict-observation path from a run whose entire
      # purpose is to be a clean control-only measurement.
      privileged_critic: false
      require_obstacle_encounter: true
      tracking_failure_pos_error_m: 3.0
      tracking_failure_steps: 25
      threat_distance_m: 1.5
      # Raised from 1.0: a privileged, collision-checked scripted oracle
      # (evaluate_velocity_dodge_oracle.py --expert) only cleared 20% of 30
      # fresh-seed episodes under the old budget, with offset_tau_s=0.8s
      # able to reach only ~71% of offset_max_m within a 1.0s reaction
      # window -- that's close to a real feasibility ceiling, not a policy
      # competence gap. 1.5s lets the same integrator reach ~85% of budget
      # before impact, paired with slower/farther throws below so there's
      # always enough flight time for the wider window to actually apply.
      # Re-measured with the oracle after this change: 53.3% (16/30),
      # landing in the intended 40-60% band -- enough headroom for the
      # policy (event_actor_v6 plateaued at ~11% under the old budget) to
      # actually climb toward, instead of asymptoting against a ~20% wall.
      threat_time_horizon_s: 1.5
      controller:
        model: rotorpy_se3
        vehicle: crazyflie
      trajectory:
        model: habitat_random_minsnap
        target_length: 15.0
        min_waypoint_distance: 2.0
        max_waypoints: 100
        max_path_attempts: 30
        # Lowered from 1.0: a slower reference gives more reaction time
        # relative to the 2-4 m/s obstacle throws and makes the reference
        # itself easier to track, while staying well under throw_speed_range_mps
        # so intercept solutions still exist (see the note on that below).
        v_avg: 0.6
        # Altitude is measured above the LOCAL floor at each sampled point,
        # not the scene's global AABB -- the earlier global-bounds version
        # let the drone fly at ~0.27 m above floor in places, well within
        # furniture height, because the AABB-relative margin said nothing
        # about what a couch's actual local floor clearance requires.
        min_altitude_m: 1.0
        ceiling_margin_m: 0.3
        lateral_margin_m: 1.0
        bounds_margin_m: 0.3
        # Validate the finished MinSnap curve against Habitat's actual 3-D
        # scene mesh. The navmesh alone cannot detect walls/furniture at flight
        # altitude. This includes the Crazyflie body plus a safety margin.
        static_clearance_m: 0.20
        collision_sample_spacing_m: 0.05
      # gated_cascaded_velocity was tried here and reverted. The appeal was
      # structural: a closed gate actively restores the nominal path, so
      # "stop deviating" would not have to be bought with reward, and it is
      # the space the expert and the lost BC loss both speak. But with no
      # displacement clip and the restoring loop switched off while the gate
      # is open, even the privileged oracle wanders -- measured on this
      # exact config it scored 23.3% / 492 steps against 36.7% / 535 here,
      # with tracking_failure rising from 1 to 5 of 30 episodes. Training
      # against an action space that costs a third of the achievable
      # ceiling is not worth the alignment with BC; the expert can be
      # re-expressed in this 3-dim space instead (oracle_action already
      # has that branch).
      residual_control:
        # No integrator: the action IS the target displacement, scaled by
        # offset_max_m, tracked with a short lag and a rate limit. With
        # squash_output bounding the action to [-1, 1] the reachable set is
        # exactly offset_max, so nothing needs an integrator to enforce it,
        # and a constant action means "hold this offset" instead of "keep
        # accelerating sideways" -- the coupling that forced the policy to
        # sit saturated just to maintain a displacement.
        # Measured: the privileged oracle scores 46.7% here against 36.7%
        # under velocity_delta_integrated, with the do-nothing control
        # unchanged at 5.0% -- so this widens the headroom band from 31.7
        # to 41.7 points. First control-mode change this session that
        # raised the ceiling rather than lowering it.
        # Trade-off accepted: a position target couples speed to distance
        # (initial speed = min(target/tau, rate_limit)), so the policy
        # cannot ask to arrive slowly. Full 0.56 m arrives in ~0.5 s
        # against a 1.5 s threat window, so that authority is not needed.
        # IMPORTANT (measured 2026-09-01): velocity_command does not consume
        # offset_accel_limit_mps2 or offset_rate_limits_mps below. Its live
        # residual authority is delta_velocity_limits_mps, unset here and
        # therefore still the task default 0.6/0.6/0.4 m/s. The old quintic
        # oracle planned against the advertised 2.5/1.5 rate envelope and was
        # clipped to 0.6/0.4 at execution -- a direct cause of its late
        # commits. The new sampling MPC models the live limits and filter.
        # Same-seed v4 gate (9001--9040): +26.1 return / 92.5% success / 2
        # collisions, versus quintic +10.1 / 62.5% / 3. Held-out 9101--9120:
        # +35.0 / 95.0% / 0. Select with evaluate_velocity_dodge_oracle.py
        # --planner sampling_mpc. No task value was changed for this result.
        mode: velocity_command
        # Raised from 0.56/0.56/0.36. The expert's planner offers candidate
        # displacements up to 1.00 m, so the old cap was clipping its choices
        # -- but a 20-episode A/B on matched seeds scored 7/20 either way
        # (failure mix near-identical), so the extra authority is free rather
        # than load-bearing. Kept because nothing argues for the artificial
        # limit, not because it was measured to help.
        # Wide enough not to bind. The cap was a hard constraint standing in
        # for something the reward already prices -- w_pos on pos_excess, the
        # proximity-scaled no-threat term, and the boundary shaping all charge
        # deviation. An oracle A/B at 0.56 vs 1.2 m scored 7/20 either way, so
        # it was not load-bearing for capability.
        #
        # Cost: the action is tanh-squashed to [-1, 1] and scaled by this, so
        # a wider cap lowers resolution for ordinary dodges (a 0.5 m dodge is
        # an action of 0.17 here, against 0.42 at the old 1.2 m). Rate limits
        # still bound how fast the offset can develop.
        offset_max_m:
        - 3.0
        - 3.0
        - 2.0
        # v20: 0.2 -> 0.1. Same stale-measurement argument as
        # offset_rate_limits_mps below: the block there floats
        # offset_command_tau_s 0.8 as an alternative stabiliser for a
        # position-reference instability that velocity_command removed. Lag
        # is pure cost now -- offset_command_tau_s 0.2 + action_filter_tau_s
        # 0.15 spent 0.35 s of a 1.5 s threat window, 23% of the time
        # available to react, on smoothing a step that no longer destabilises
        # anything.
        offset_command_tau_s: 0.1
        # Bounds the reference-velocity feedforward handed to SE3 (the
        # derivative of this offset); an unlimited step would spike it and
        # Kd would turn that straight into acceleration.
        # Measured in an empty scene with no expert and no obstacles: a
        # 0.45 m sidestep flipped the vehicle past 109 deg on 4/4 seeds, and
        # oracle episodes lost ~46 points of episode success to out_of_bounds
        # that were this instability, not avoidance failures (control arm: 0
        # bounds exits in 40 episodes).
        #
        # The boundary is the offset command's *velocity*, not its amplitude
        # -- 0.75 m at 0.50 m/s is clean, 0.45 m at 1.20 m/s flips -- so this
        # ceiling stays low. It still matters with the accel limit below,
        # because the braking law permits sqrt(2*a*|e|), which reaches
        # 1.55 m/s against a 3.0 m offset_max_m.
        # 0.6 came from linear position ramps, which step the velocity --
        # the exact condition the acceleration limit below now prevents. Under
        # smooth shaping 0.75 m/s measures clean at 8 deg of tilt, against a
        # 17.4 deg control-arm baseline. This ceiling also gags the planner:
        # expert_for_task derives max_horizontal_speed_mps from it, so 0.6
        # made the expert reject 92% of candidates and command zero action
        # into collisions (visible on video at 0.10 m with a live THREAT).
        # v20: 0.8 -> 1.5 (and 0.5 -> 1.0 vertical). EVERY flip measurement
        # in the block above is STALE -- all of it was taken on the old
        # control path, and none of it constrains the current one.
        #
        # Commit 5225691 is explicit: "Every dynamic config ran that path
        # (control_abstraction: cmd_ctbr with a residual mode that shifts the
        # POSITION reference)", and the 97.2 deg trace it cites is that path.
        # SE3Control built b3_des = normalize(F_des) with no term keeping the
        # vehicle upright, so a position-reference step arrived as an error it
        # had no feedforward for and it answered with attitude -- exactly what
        # the comment above describes. The fix moved to cmd_vel + residual
        # mode velocity_command, where F_des = m*(-k_v*(v - cmd_v) + g) has NO
        # POSITION TERM. The mechanism that produced those flips is gone.
        #
        # Measured after that fix (20 episodes, same commit): achieved
        # deviation p90 3.45 m -> 0.41 m, equal to commanded, and
        # out_of_bounds 3-7 -> 0. Zero. The instability this ceiling was
        # protecting against no longer occurs, so the ceiling was costing
        # response time for nothing.
        #
        # Still verified rather than assumed: sporadic per-seed divergence is
        # how this bug hid the first time. The oracle gate re-run for v20
        # checks out_of_bounds and peak tilt at these limits, and if either
        # moves off zero these come straight back down.
        offset_rate_limits_mps:
        - 2.5
        - 2.5
        - 1.5
        # Bounding velocity alone is not enough: a plain rate limiter at
        # 0.6 m/s still flipped 4/4, because it steps the velocity (bounded
        # speed, unbounded acceleration). Bounding acceleration is what makes
        # the reference physically realisable -- SE3 is handed x and x_dot
        # shifted by the offset while x_ddot stays nominal, so a velocity
        # step arrives as an error it has no feedforward for and it answers
        # with attitude.
        #
        # 0.4 m/s^2 with the sqrt(2*a*|e|) approach law: tilt 4.9-6.2 deg and
        # the command lands on 0.451 m against a 0.45 m target. The simpler
        # fix of offset_command_tau_s 0.8 also stabilises it, but costs 0.6 s
        # of response and reaches only 0.419 m.
        # 0.8 completes a 0.45 m dodge in 1.10-1.20 s, inside the ~1.5 s
        # threat horizon; 0.4 took 1.55-1.65 s and could not finish in time.
        # 1.6 flipped one seed of four (87 deg) -- rejected, since sporadic
        # per-seed divergence is precisely how this bug stayed hidden.
        # 1.5 -> 5.0, and offset_rate_limits_mps 1.5/1.0 -> 2.5/1.5 above.
        # The handoff recorded 1.5 as a user-specified constraint; that
        # constraint has been lifted, and it was the binding one.
        #
        # WHAT IT BUYS. Dodge time is sqrt(2d/a) + lag, with d = 0.35 m (the
        # measured worst-case requirement, oracle_magnitude_probe.py) and lag
        # 0.15 s (offset_command_tau_s 0.1 + action_filter_tau_s 0.05):
        #
        #   a = 1.5  -> 0.83 s   peak speed 0.72 m/s
        #   a = 3.0  -> 0.63 s   peak speed 1.02 m/s
        #   a = 5.0  -> 0.52 s   peak speed 1.32 m/s
        #   a = 8.0  -> 0.45 s   peak speed 1.67 m/s  (exceeds a 1.5 rate cap)
        #
        # Acceleration stops buying anything past ~6.4 m/s^2 unless the rate
        # limit rises with it, since a triangular profile over 0.35 m peaks at
        # sqrt(a*d). Hence both move together. 2.5 m/s leaves headroom above
        # the 1.32 m/s a 0.35 m dodge actually needs, so the profile stays
        # acceleration-limited rather than clipping.
        #
        # PHYSICAL PLAUSIBILITY: 5.0 m/s^2 of lateral acceleration is
        # g*tan(27 deg), i.e. a 27-degree bank. That is well inside a
        # Crazyflie's authority but it is NOT free -- this repo has a
        # documented tip-over history (SE3 control flipping past 90 deg, 1-3
        # in 20, present in the unmodified baseline). VERIFY IT before
        # trusting it: run the gate and check terminations for
        # tracking_failure and out_of_bounds, which is exactly how the old
        # rate-limit increase was caught.
        offset_accel_limit_mps2: 5.0
        # v20: 0.15 -> 0.05. See offset_command_tau_s above. Together the two
        # cut command lag 0.35 s -> 0.15 s, returning 0.20 s (13%) of the
        # threat window to actually moving.
        action_filter_tau_s: 0.05
      # THIS is the diagnostic. The actor is handed the same 9-D nearest-
      # obstacle geometry the critic used to get: body-frame rel_pos (3),
      # rel_vel (3), clearance, time_to_closest_approach, and a validity
      # flag. Nothing here is obtainable by a real drone -- that is the
      # point. If dodging is not learnable from this, it is not learnable
      # from an event camera either, and no encoder or BC pipeline can help.
      privileged_actor: true
      # 3 slots = max_concurrent, so the channel is LOSSLESS: no hidden
      # obstacles, and no silently switching slot identity. The default of 1
      # hides two of three obstacles and reassigns its meaning whenever the
      # threat sort reorders.
      # 3 -> 1, lossless now that max_concurrent is 1. Keeping 3 would feed
      # the network 24 permanently-zero inputs.
      privileged_obstacle_slots: 1
      # Required for sufficiency, not a nicety. One of the three obstacle
      # templates is kinematic_parabola at 3.0 m/s^2, which curves ~2.16 m
      # over a 1.2 s flight against a 0.30 m contact radius. Position and
      # velocity at a single instant cannot separate a line from a parabola,
      # so without this a FEEDFORWARD policy provably cannot infer which it
      # faces -- the channel would be "privileged" but not Markov, and a
      # failure could not be attributed to the task.
      #
      # This is also why the reference architecture (arXiv 2603.07578) does
      # NOT transfer here. Its teacher is a feedforward MLP reading a 10-bin
      # angular distance map at a single instant, and that is sufficient for
      # it because its obstacles are STATIC trees: all relative motion comes
      # from ego-motion, which the teacher already observes. Its two GRU
      # layers sit only in the student's event encoder, compensating for a
      # poor sensor, not for a moving world. Adopting its distance map here
      # would strictly REMOVE information (rel_vel has no representation in
      # it) and make the task unsolvable feedforward.
      privileged_obstacle_acceleration: true
      # obs = 18 proprioception + 3 slots x 12 = 54.
      #   proprioception: v_body, v_ref_body, pos_err_body, offset_body,
      #                   omega_body, prev_action
      #   slot:           valid, rel_pos(3), rel_vel(3), rel_accel(3),
      #                   clearance, time_to_closest_approach
  # skokloster only, for training and eval alike. apartment_1's rooms are
  # tight enough that clearing an obstacle and staying in bounds are in
  # direct tension (the privileged oracle itself went out of bounds in
  # 3-4 of 30 episodes there), so a large fraction of episodes had no
  # good answer available. env.py takes scenes[0], so listing one scene
  # is also what actually makes the choice take effect.
  scenes:
  - name: skokloster
    path: data/scene_datasets/habitat-test-scenes/skokloster-castle.glb
  sensors:
    event_camera_1:
      type: event
      position:
      - 0.0
      - 0.0
      - 0.05
      orientation:
      - 0.0
      - -1.5707963267948966
      - 0.0
      # 640x480 -> 320x240. Six OOMs came from CNN activations over the full
      # frame: the last died in a ReLU forward allocating 750 MB, which is
      # exactly 64 x 16 x 240 x 320 x 4 for conv1 at aux batch 64. Every fix
      # so far moved that cost around (n_steps, GPU placement, BPTT window,
      # freezing one tower, then both) without reducing it. Quartering the
      # pixels quarters it everywhere at once.
      #
      # Detail cost is acceptable: the 0.15 m sphere subtends 8.6 deg at 2 m
      # and 4.3 deg at 4 m, which is 23 and 11 px at 320 wide -- still well
      # resolved against the 10 deg aux bins.
      width: 320
      height: 240
      hfov: 120
      zfar: 20.0
      backend: cuda
      contrast_threshold_neg: 0.15
      contrast_threshold_pos: 0.15
      anti_aliasing: 8
  visual_backend:
    enable_physics: true
    agent_radius: 0.15
    # Keep shortest paths away from wall/furniture boundaries; the finished
    # curve is independently checked against the 3-D mesh below.
    navmesh_agent_radius: 0.25
    dynamic_obstacles:
      enabled: true
      # Switched from the scripted intercept scheduler (guaranteed-hit
      # throws solved against the nominal trajectory) to this simpler,
      # organic spawner: throws are aimed at wherever the drone actually is
      # at spawn time, plus noise, with no solve against a future path.
      # Less scripted, more naturalistic obstacle field for a straight PPO
      # run.
      intercept_schedule:
        enabled: false
      # 14 concurrent (v8) was too dense to be learnable: ~15 throws per
      # episode against a success criterion that is conjunctive over every
      # one of them pinned success_rate at 0 regardless of skill, and left
      # no quiet stretch in which tracking well was even possible -- the
      # threat flag was true on 100% of sampled steps. 6 keeps the field
      # busy while leaving gaps to track through, so the reward can tell
      # dodging and loitering apart.
      spawn_interval_s: 0.30
      # +/-60%: waits land in [1.0, 4.0] s. At a fixed 2.5 s the policy's
      # speed swung 78% of its mean with phase in the spawn cycle while its
      # commanded action barely changed -- it was riding the clock, not
      # reacting to what it saw.
      spawn_interval_jitter: 0.6
      # Raised from 3 with scattered aim. Density and *threat* density are no
      # longer the same thing: an aimed field makes nearly every throw a
      # threat, while scattered throws mostly pass by, so 10 concurrent here
      # is far less punishing than the 14 aimed that pinned success at 0.
      # 5, from a concurrency sweep under re-aiming (control/oracle, throw
      # rate held constant): the gap peaks here at +18.8 points and inverts
      # by 8. Too many re-aiming throws and the whole threat formation
      # follows the drone, leaving the relative geometry invariant to its
      # motion -- evasion is then impossible in principle. Too few and
      # passivity survives anyway.
      #   2 concurrent: control 75.0%  oracle 81.2%  gap  +6.2
      #   3 concurrent: control 62.5%  oracle 75.0%  gap +12.5
      #   5 concurrent: control 50.0%  oracle 68.8%  gap +18.8
      #   8 concurrent: control 50.0%  oracle 43.8%  gap  -6.2
      # 12 @ 0.45 s. Measured with matched arms: control success falls
      # 45.8% -> 29.2% -> 8.3% across 5/8/12 concurrent, so this is the first
      # setting with real headroom. Non-degeneracy is unaffected -- re-aiming
      # makes every constant offset score 0% regardless of density.
      # 3 -> 1. The single best-evidenced change available, from
      # oracle_prediction_probe.py on v20/v2:
      #   plans made 120, FAILED 666 -> 84.7% plan failure rate
      #   collisions: 7 on obstacles WITH a plan, 7 with NONE
      # The planner must fit one quintic clearing EVERY active obstacle by
      # safety_margin_m from its current offset and velocity, and most of the
      # time no such curve exists. Half the oracle's collisions are on
      # obstacles it never planned for at all. With one obstacle the planner
      # solves the problem it was actually designed for, and since the oracle
      # is the teacher the whole BC route depends on, its ceiling is the
      # project's ceiling.
      #
      # This also makes the threat sort irrelevant, which matters because
      # obstacle_threat_priority keys on a CONSTANT-VELOCITY
      # predicted_clearance and therefore misranks the ballistic template.
      max_concurrent: 1
      # Slowed from [2.0, 4.0] and spawns moved farther out below: paired
      # with threat_time_horizon_s above, this guarantees enough total
      # flight time (min ~7m/3.0mps=2.33s) for the widened reaction window
      # to actually be reachable rather than clipped by the throw arriving
      # first. See threat_time_horizon_s comment for the oracle evidence.
      throw_speed_range_mps:
      - 1.5
      - 3.0
      angular_speed_range_radps:
      - 0.0
      - 1.0
      azimuth_range_deg:
      - -45.0
      - 45.0
      # 5.5-7.5 -> 7.0-9.0, paired with kinematic_speed_mps 5.0 -> 6.5 below.
      #
      # FEASIBILITY, derived not guessed. A dodge needs the measured 0.35 m
      # worst-case displacement (oracle_magnitude_probe.py) at
      # offset_accel_limit_mps2 1.5, i.e. sqrt(2*0.35/1.5) = 0.68 s, plus
      # 0.15 s of command lag (offset_command_tau_s 0.1 + action_filter_tau_s
      # 0.05) = 0.83 s. So spawn_distance / obstacle_speed must exceed 0.83 s.
      #
      #   7.0 m / 10.0 m/s = 0.70 s     9.0 m / 10.0 m/s = 0.90 s
      # against a 0.52 s dodge requirement at offset_accel_limit_mps2 5.0.
      #
      # Tight but feasible, with margin left for the perception latency the
      # event-camera student will add later. At the old 5.5 m spawn, 6.5 m/s
      # would give 0.85 s -- inside the bound by 0.02 s, which is no margin at
      # all, hence moving the spawn out rather than only raising speed.
      #
      # Note the window CANNOT be pushed much below ~0.8 s without raising
      # offset_accel_limit_mps2, which the handoff records as a user-specified
      # constraint. Speed alone does not shorten the window; it has to be
      # paired with distance or it breaks feasibility.
      radial_distance_range_m:
      - 7.0
      - 9.0
      # Symmetric about the drone (was [-0.25, 1.0], skewed strongly
      # upward). That skew put 61% of obstacles above the vehicle, and the
      # v12 policy found the blanket answer: its mean offset was
      # [+0.009, +0.094, -0.290] in world axes -- 95% of it straight down.
      # Ducking beats the whole obstacle distribution without perceiving
      # anything, which is why it persisted with obstacles disabled and why
      # the deadband, clearance-shaping and lead-aim changes each moved it
      # by under 10%: none of them touched the asymmetry paying for it.
      # Symmetric spawning leaves no free direction -- descending now helps
      # against half the throws and hurts against the other half, so only
      # reacting to the specific incoming obstacle works.
      relative_height_range_m:
      - -0.6
      - 0.6
      aim_noise_std_m: 0.3
      # Half the throws lead the drone, half aim where it is at spawn time.
      # Aiming only at the current position made motion itself evasive:
      # over a 1.4-2.0 s flight a drone drifting at ~1.1 m/s displaces
      # several times the 0.30 m hit radius, so v10 survived above the
      # do-nothing control (318 vs 254 steps) while holding a 0.72 m
      # standing offset and never modulating it for threats -- it was
      # rewarded for wandering, not for seeing. A pure lead solve would
      # just invert the exploit (hold still and the intercept degenerates),
      # so the two are mixed per throw.
      #
      # Raised 0.5 -> 0.8. At an even split, half of all throws still aimed
      # where the drone was at spawn time, and for those a sustained drift
      # remains genuinely evasive -- so the ~0.6 m standing offset was not a
      # reward hack but a rational answer to half the obstacle population,
      # which is why neither reward change above removed it. At 0.8 drifting
      # only answers one throw in five, while keeping enough
      # current-position aim that simply freezing (which degenerates the
      # intercept solve) is not a blanket answer either.
      # Aiming at all is what made position itself a strategy, so both aim
      # modes are off and throws scatter through the neighbourhood instead.
      lead_aim_probability: 1.0
      # Scatter is now a diversity term, not the difficulty knob: re-aiming
      # is what makes throws threatening, so the spread only keeps them from
      # arriving identically.
      # 0.3, down from 1.0. Preserving each throw's scatter offset through
      # re-aiming meant throws tracked faithfully to a point ~0.75 m from the
      # drone -- well outside the ~0.3 m combined hit radius -- so they were
      # aimed to miss by construction, and a passive drone still survived
      # 57.5% of episodes.
      #
      # Wide scatter was only ever needed because aiming once at spawn made a
      # tight aim escapable by drifting. Re-aiming removes that coupling, so
      # the aim can be tight again: the offset now supplies variety, not a
      # built-in miss.
      # UNAIMED FIELD (2026-08-24). Throws aimed at the drone made the task
      # solvable without perception: a BC clone with its event frames ZEROED
      # scored 58.3% vs 56.7% sighted, because any displacement evades a
      # homing throw and direction carries no information. Measured value of
      # motion vs perception, by aim_scatter_m at n=40:
      #   0.3 (aimed):  motion +30.0  perception  +7.5
      #   1.5:          motion  -7.5  perception +27.5
      #   2.5:          motion -10.0  perception +10.0, oracle == control
      # 1.5 is the optimum: threats are real but do not track the vehicle,
      # so blind motion becomes harmful and knowing where obstacles are is
      # what pays. Same asymmetry seen on the static task, where vision was
      # worth +11.5 per-encounter points against -1.3 here.
      aim_scatter_m: 0.25
      # Throws steer toward their aim point until 0.5 s before arrival, then
      # go ballistic. Drifting stops paying (they follow), while a late
      # decisive dodge still works -- and that puts the required reaction in
      # the window where the event signal is strongest (SNR 0.014-0.020 at
      # 0.25-0.5 s, against 0.008 further out).
      # Commit immediately: any homing at all re-introduces the exploit,
      # and no commit window fixes it (a dodge needs ~1.1 s to complete, so
      # any window long enough to dodge in is long enough to drift out of).
      reaim_commit_time_s: 10.0
      reaim_max_turn_rate_radps: 2.0
      seed: 7
      # Mixed motion models. With every obstacle on a straight line aimed at
      # the drone, the approach is constant-bearing: the obstacle barely
      # translates in the image and only looms, sitting at 9-18 px for most
      # of its flight and filling the frame in the last ~0.2 s. That is the
      # weakest possible signal for an event camera, which fires on
      # image-plane motion -- so the thing the policy most needs to see is
      # nearly invisible until it is too late to act on.
      #
      # A parabola curves, so its bearing changes throughout the flight and
      # it sweeps across the image. Gravity is 3.0 rather than 9.81 on
      # purpose: the ballistic solve launches upward to compensate, and at
      # Earth gravity that pushes true speed to 8.5-11 m/s (vs the nominal
      # 5). At 3.0 the arc is pronounced while speed stays 5.4-5.8 m/s.
      templates:
      - handle: uvSphereSolid
        scale:
        - 0.15
        - 0.15
        - 0.15
        motion_mode: kinematic_line
        mass: 0.2
        # 4.5 -> 3.0: with max_concurrent 1 the slot is held until ttl, so a
        # long ttl starves the episode of encounters. Flight is 1.08-1.38 s,
        # so 3.0 s lets the throw pass and despawn without idling the slot.
        ttl_s: 3.0
        collision_radius: 0.15
        kinematic_speed_mps: 10.0
      - handle: uvSphereSolid
        scale:
        - 0.15
        - 0.15
        - 0.15
        motion_mode: kinematic_parabola
        mass: 0.2
        ttl_s: 3.0
        collision_radius: 0.15
        kinematic_speed_mps: 10.0
        parabola_gravity_mps2: 3.0
      - handle: uvSphereSolid
        scale:
        - 0.15
        - 0.15
        - 0.15
        motion_mode: kinematic_line
        mass: 0.2
        ttl_s: 3.5
        collision_radius: 0.15
        # Kept slower than the other two for genuine variety: at 7-9 m this
        # gives a 0.88-1.13 s window against the fast templates' 0.70-0.90 s.
        kinematic_speed_mps: 8.0
  dynamics:
    model: rotorpy_multirotor_euler
    vehicle: crazyflie
    control_abstraction: cmd_vel
    max_speed_mps: 3.0
    ctbr_rate_limits:
      roll: 7.0
      pitch: 7.0
      yaw: 5.0
    domain_randomization:
      enabled: true
      resample_every: 50
      scales:
        mass:
        - 0.85
        - 1.15
        k_eta:
        - 0.9
        - 1.1
        k_m:
        - 0.9
        - 1.1
        rotor_speed_min:
        - 1.0
        - 1.0
        rotor_speed_max:
        - 0.95
        - 1.05
  simulator:
    world_rate: 1000
    control_rate: 100
    sim_time: 30
    coord_transform: rotorpy_to_hm3d
    sensor_rates:
      event_camera_1: 50
    viz_rates:
      event_camera_1: 50
    domain_randomization:
      enabled: false
      resample_every: 50
      sensors:
        event_camera_1:
          contrast_threshold_neg:
            range:
            - 0.1
            - 0.3
          contrast_threshold_pos:
            range:
            - 0.1
            - 0.3
          hfov:
            choices:
            - 90
            - 120
ppo:
  learning_rate: 0.0003
  # 512 -> 256. Two OOMs on a 23.5 GB card taught the real budget: the
  # rollout buffer is only part of it. At 8 envs x 512 the main process held
  # 17.71 GiB -- buffer ~10 GB plus model, grads, activations, the aux
  # callback's materialised batches and RecurrentPPO's stored LSTM states --
  # while the six Habitat workers hold ~820 MiB of GPU EACH (~5 GB), for
  # 22.6 of 23.55 GiB. Halving n_steps takes the buffer to ~5 GB and the main
  # process to ~12-13 GB. 2048 transitions per update with batch_size 128 is
  # 16 minibatches.
  # 128 -> 32, to bound BPTT. RecurrentPPO backpropagates through whole
  # sequences, and with a CNN over (2,480,640) inputs every timestep in a
  # sequence retains its convolutional activations for the backward pass.
  # Sequence length is capped by n_steps but is really set by EPISODE length,
  # so memory GROWS AS THE POLICY IMPROVES: the learner climbed 10.9 -> 12.6
  # -> 14.8 -> 23.2 GB as success rose, then died in backward. This is not a
  # leak and no allocator setting fixes it -- the BPTT window has to be
  # shorter. 32 steps at 20 Hz is 1.6 s of context, comfortably longer than
  # the 1.1-1.5 s throw flight time the LSTM needs to integrate over.
  # 256 -> 128. Unfrozen EfficientNet-B0 (x2 towers, ~4M params each) means
  # PPO's own backward pass now builds a full gradient graph through both
  # large CNNs every update -- measured steady-state reserved memory 17.3 GB
  # of 23.55 GB, STABLE (not a leak, confirmed via CudaMemoryProbe). The
  # crash came from eval's transient overhead tipping that thin margin over:
  # OOM landed at exactly eval.freq=32768, right after
  # "Eval num_timesteps=32768" printed successfully. Shrinking the
  # steady-state footprint gives real headroom for eval's spike.
  #
  # v17: 128 -> 256. n_steps 128 was residue from the OOM crisis, forced down
  # while chasing what turned out to be an autograd reference cycle in
  # PreTanhPenalty._hook (the closure captured `output`, making
  # output->hooks->closure->output uncollectable and holding multi-GB graphs).
  # That is fixed; buffer size was never the cause, and shrinking it cost the
  # run its credit assignment:
  #   * ep_len_mean measured 157 steps -- the 128-step rollout did not contain
  #     a single complete episode
  #   * gamma 0.994 at 20 Hz is a 167-step effective horizon, LONGER than the
  #     rollout window
  #   * so the collision penalty, the one event distinguishing a good dodge
  #     from a bad one, always landed past the buffer edge, and essentially
  #     all credit came from a bootstrapped V that explained_variance said was
  #     worthless (oscillating around zero, -0.06 to +0.13, for all 294k
  #     steps of the v16_effnet run)
  # That is a closed loop: useless critic -> advantages that are raw return
  # noise -> no policy improvement -> no better data for the critic. The run
  # was flat at ep_rew_mean ~ -165 from 50k to 294k (blind sine weave is
  # -122.1), with held-out eval DECLINING (-153.5 at 131k -> -210.5 at 262k)
  # while std collapsed 0.596 -> 0.369, i.e. converging onto the non-solution.
  #
  # 256 > 157 (full episode) and > 167 (gamma horizon), which is what the
  # v16 header argued for before OOM forced otherwise. Cost is ~+2.5 GB of
  # rollout buffer on a run whose steady state measured 8862 MiB of 24564 --
  # affordable now that the leak is gone. 512 would also fit arithmetically
  # but leaves no margin for eval's transient spike, which is what actually
  # triggered the OOM at eval.freq previously.
  n_steps: 256
  # 32 -> 64. NOT a free knob -- batch_size, not n_steps, is what actually
  # drives GPU memory here, which a first v17 attempt at 128 established
  # empirically before being killed at 16384 steps:
  #     [mem] post-rollout alloc=241MiB reserved=20874MiB peak=17276MiB
  #     [mem] post-train   alloc=224MiB reserved=20874MiB train_delta=-16
  # Steady allocation is ~230 MiB and train_delta is NEGATIVE, so the rollout
  # buffer is not resident on the GPU at all and doubling n_steps costs
  # essentially nothing there. The whole 17.3 GB peak is the transient
  # forward+backward through BOTH EfficientNet-B0 towers over a minibatch of
  # (8, 240, 320) event tensors -- it scales with batch_size alone.
  #
  # 20874 of 24564 MiB left ~3.7 GB of headroom, and the v16 header above
  # records the precise failure that invites: a run sitting at 17.3 GB stable
  # OOM'd at exactly eval.freq=32768 when eval's transient tipped the margin.
  # Killed at 16384 rather than walk into it a second time.
  #
  # 64 halves the activation peak to roughly 9 GB. The cost is throughput,
  # not correctness: 2048 transitions / 64 = 32 minibatches x 4 epochs = 128
  # backward passes per update, 2x v16's 64. Wall-clock per update rises;
  # the horizon fix that motivates v17 is untouched, since it lives entirely
  # in n_steps.
  batch_size: 64
  n_epochs: 4
  # 0.994 -> 0.97. MEASURED cause, not a guess.
  #
  # ev_ceiling_probe.py on the v1 teacher's own 54-dim Markov state (three
  # obstacle slots with position, velocity AND acceleration -- no perception,
  # no encoder, no expert anywhere in the measurement):
  #
  #   state+priv(54) MLP, regularised     0.062 / -0.033 across two runs
  #   HINDSIGHT steps_remaining only      0.771
  #   HINDSIGHT crashed only              0.000
  #   between-episode share of variance   69-79%
  #   corr(episode return, episode length) = +0.958
  #
  # Discounted return-to-go is a SURVIVAL-TIME PROXY, and the causal ceiling
  # on predicting it is indistinguishable from zero. EV ~ 0 through v16-v22
  # was therefore CORRECT BEHAVIOUR by the critic, not a broken critic, and
  # every hyperparameter run that chased it was chasing something
  # unreachable.
  #
  # The mechanism is the horizon. 1/(1-0.994) = 167 steps, LONGER than the
  # ~150-step episode, so the critic is asked to predict survival across many
  # obstacles that have not spawned yet (spawn_interval_s 0.30, continuous
  # arrival). That is irreducible noise, not a modelling failure.
  #
  # 1/(1-0.97) = 33 steps = 1.65 s at 20 Hz, matched to the task's own
  # threat_time_horizon_s of 1.5 s. Over that span the privileged obstacle
  # state DOES determine the outcome, so the critic is being asked a question
  # its inputs can answer. Dodging is inherently reactive on this timescale --
  # the expert's whole plan (rise 0.55 s, return 1.0 s) fits inside it -- so
  # little of value is given up by not valuing 8 seconds ahead.
  #
  # This is the single highest-leverage change available: it does not touch
  # perception, the encoder, the expert, or the network.
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.2
  # Was 0.0: nothing was counteracting PPO's tendency to shrink action
  # variance once it settles anywhere, even a degenerate "don't act" optimum
  # -- which 600k steps of the previous run (v2) settled into exactly,
  # producing behavior identical to the zero-action baseline throughout.
  # v3+v4 (~1.2M combined steps) then sat at this constant 0.01 too long:
  # log_std barely moved (-0.60 -> -0.67 over v4's 600k), stochastic-rollout
  # encounter_clear_rate stayed healthy (noise-assisted dodges) while
  # deterministic eval success stayed flat near 0% -- the mean policy never
  # had to converge because the entropy bonus kept propping up exploration
  # noise indefinitely. ent_coef_final below anneals this to 0 over the
  # resumed run instead of holding it constant.
  ent_coef: 0.01
  ent_coef_final: 0.0
  # 0.02 -> 0.06. Measured on the v15 run: 39 of 42 updates hit
  # "Early stopping at step 0 due to reaching max kl: 0.09", so SB3 broke out
  # of the epoch loop on the FIRST minibatch and applied roughly 1 gradient
  # step where n_epochs 4 x 16 minibatches intends 64. The actor was learning
  # at ~1/64 of the configured rate, which is why pretanh_abs_mean crawled at
  # 0.01-0.02. The recurrent policy shifts more per update than the
  # feedforward config this was tuned for, so the old bound no longer fits.
  target_kl: 0.06
  # Raised from -1.0: with a still-random CNN and no reward for successfully
  # clearing an obstacle (see w_encounter_clear below), the policy needs
  # enough exploration variance to ever sample a real dodge attempt, or
  # gradient descent has nothing obstacle-correlated to reinforce.
  # Back to -0.5 (std 0.61) from -0.2 (std 0.82). On a [-1, 1] action space
  # 0.82 is close to uniform-random: v9 ran correction_energy 0.86 and
  # pos_error ~1.05 against 0.09 for pure tracking, i.e. exploration was not
  # perturbing a trajectory so much as replacing it with noise, and 5/8 eval
  # episodes ended out_of_bounds rather than in a collision. 0.61 still
  # explores widely, and ent_coef_final anneals it down over the run.
  log_std_init: -0.5
  # Only read on the --resume-checkpoint path, where log_std would
  # otherwise come back from the checkpoint already converged and narrow
  # (v7 finished at -0.85 / std 0.43), silently making log_std_init above
  # dead config. Inert for a from-scratch run.
  reset_log_std_on_resume: true
  # Independent per-step Gaussian exploration is almost entirely cancelled
  # by the residual-control leaky integrator before it ever becomes a real
  # offset: at the 50Hz policy rate against offset_tau_s=0.8s, i.i.d.
  # resampling reaches only ~sqrt(dt/2*tau) =~11% of the displacement a
  # sustained action would -- measured to match: peak in-threat offsets of
  # ~0.06-0.09m against a 0.56m budget, right at that ratio. SDE holds
  # exploration noise correlated across sde_sample_freq steps instead of
  # resampling it every step, so it survives the integrator instead of
  # being averaged out by it.
  # Tightened from 40 to 20 (~0.4s, half offset_tau_s instead of matching
  # it): v3 confirmed the exploration fix worked (encounter_clear_rate rose
  # and held at 60-70%) but also grew a large, worsening out_of_bounds
  # failure mode -- a 40-step hold lets one uncorrelated SDE sample commit
  # to a large push for close to a full integrator time constant with no
  # chance to recorrect mid-swing. 20 keeps most of the averaging fix
  # (dt/tau moves from 0.025 to 0.4/0.8=0.5, attenuation factor
  # sqrt(0.5/2)=0.5 instead of the original 0.11, still a ~4.5x improvement)
  # while resampling twice as often, so a bad direction gets corrected
  # sooner instead of riding out the full swing.
  # 15 -> 0 for the privileged teacher run. The comment below is right that
  # this is "only meaningful with --bc-warm-start" -- and this run does not
  # use one, so a value of 15 freezes a RANDOMLY INITIALISED actor.
  #
  # Worse, it does not reliably thaw. With actor_release_explained_variance
  # unset the callback defaults release_ev to 0.0 and waits for EV >= 0 on
  # three consecutive updates; EV starts negative, so the actor can stay
  # frozen indefinitely. That is exactly how v22 ran its entire length with
  # the actor never released. Caught here at 20k steps by
  # train/actor_frozen = 1 with approx_kl ~ -1e-10 and clip_fraction = 0 --
  # the signature of a policy receiving no gradient at all. Success drifting
  # 0.12 -> 0.18 was the critic and VecNormalize moving, not learning.
  #
  # Nothing in this run needs a warm-up: the freeze exists to protect an
  # event encoder from early PPO gradients, and obs_mode: state has no
  # encoder to protect (stock MlpPolicy).
  #
  # Original comment, retained: only meaningful with --bc-warm-start: holds
  # the cloned actor still while the value head fits its returns. v15
  # warm-started without this and lost the clone inside ~8 updates
  # (explained_variance -0.003 -> 0.7 over that span), dropping below its own
  # starting success rate before recovering.
  actor_freeze_updates: 0
  # L2 on the pre-tanh action mean. squash_output bounds the action but not
  # the mean behind it, and both v23 and v24 died the same way: v24's mean
  # |mu| held at 0.001-0.002 through 131k steps, then hit 0.567 (max 3.661,
  # 18.5% of components past 1) by 229k, with success collapsing to 0.0% and
  # train/entropy_loss crossing zero at 164k on the way to v23's +10.9. Past
  # |mu| ~ 2 the tanh derivative is under 0.08 and the gradient stops
  # arriving. Watch train/pretanh_abs_mean and train/pretanh_frac_gt1.
  # Supervises the actor's event encoder with an obstacle distance map --
  # something proprioception cannot supply, so the term can only be satisfied
  # through vision. Measured as the only mechanism that taught this encoder to
  # see: held-out distance R2 0.334 with it, ~0.0 without.
  # Recurrence, not frame stacking. A single time surface shows WHERE edges
  # fired, not how fast the obstacle is closing: distance from one event
  # frame is genuinely ambiguous (a near small sphere and a far large one
  # give similar patterns; only their rate of change separates them), and
  # time-to-impact -- which decides when to dodge -- is not recoverable
  # either. So both the policy AND the auxiliary distance decoder were being
  # asked for quantities their input does not contain.
  #
  # Frame stacking (history_frames) was the cheap approximation, and it has
  # already been tried here (two *_history.yaml configs use 4). It also costs
  # memory exactly where we are constrained: 3 frames triple the observation
  # to 7.37 MB, forcing n_steps 512 -> 128 to fit the rollout buffer. An LSTM
  # carries unbounded history in a few hundred floats at no buffer cost, so
  # n_steps stays at 512.
  #
  # 2 layers matches the event-camera reference (arXiv 2603.07578), which
  # inserts two recurrent layers into EfficientNet-B0.
  # Keep the event CNN out of PPO's autograd graph. RecurrentPPO's BPTT
  # retains every timestep's convolutional activations over a (2,480,640)
  # input, so learner memory grows as episodes lengthen -- measured climbing
  # 4.8 -> 24.0 GB as success rose, then dying in backward. Five OOMs across
  # n_steps 512/256/128/32 and both GPU placements: shrinking buffers never
  # addressed it because the activations, not the buffer, dominate.
  #
  # Frozen parameters with non-grad inputs build no graph, so the CNN's
  # activations are never allocated. The encoder is still trained -- by the
  # auxiliary occupancy term, which re-enables gradients for its own step.
  # That is also the reference's structure (arXiv 2603.07578): encoder
  # trained by auxiliary supervision, decoder discarded, policy on top.
  # UNFROZEN. freeze_extractor_for_ppo existed to fix RecurrentPPO's BPTT
  # memory retention -- backprop through a CNN across a whole sequence was
  # what OOMed. That justification is gone in v16: it dropped recurrence for
  # stacked frames, so a PPO backward pass is a single-step gradient, not
  # accumulated over a sequence. v11 (before this flag existed) ran 213k
  # steps of full unfrozen backprop with no per-update leak at all -- it only
  # died from an oversized fixed buffer.
  #
  # Keeping it frozen here had a real cost the memory framing hid: the policy
  # head sat on frozen features and only ever received gradient from the aux
  # occupancy proxy -- never "does attending to this pattern improve return".
  # That is the actual explanation for zeroing events having no effect in
  # every prior blind ablation: the event pathway was never shaped by the
  # task reward at all. Unfreezing lets PPO's gradient and the aux term both
  # shape the same CNN weights, which is the standard combination -- aux
  # anchors the representation toward obstacle occupancy, PPO's gradient
  # further shapes it toward what the actual dodge decision needs.
  # v19: false -> true. THE ONLY CHANGE FROM v18 -- a deliberate single-
  # variable A/B, so anything that moves is attributable to this.
  #
  # This was previously false on the correct argument that PPO's reward
  # signal should reach the event encoder, or the policy is only fit on the
  # state vector. Four runs have since measured what PPO's gradient actually
  # DOES to that encoder. It loads at distance_r2 0.64 from
  # pretrained_encoder_effnet_final.pt and collapses within a few thousand
  # steps, every time, regardless of what else changed:
  #     v16 (n_steps 128)         0.10
  #     v17 (n_steps 256)         0.10
  #     v18 (sde 8, clear x30)    0.136
  #     critic tower, all runs    0.05
  # So the choice is not "PPO shapes the features" vs "frozen features". It
  # is DESTROYED features vs preserved ones.
  #
  # This is the last untested explanation for a capability ceiling that v18
  # established directly: quadrupling w_encounter_clear 8 -> 30 moved
  # encounter_clear_rate not at all (0.696 in both v17 and v18, to three
  # digits), and authority_used_in_threat stayed ~0.12-0.15. A policy that
  # will not dodge harder for 4x the payoff is not trading off incentives --
  # it cannot aim, which is what distance_r2 0.13 means.
  #
  # Frozen here means frozen FOR PPO only: DistanceAuxCallback re-enables
  # gradients for its own step and re-freezes after, so the occupancy task
  # keeps training the encoder. Expect distance_r2 to climb back toward the
  # pretrained 0.64 instead of collapsing -- that is the first check, and if
  # it does not happen the run says nothing about perception.
  #
  # Reading the result:
  #   clear rate rises above 0.696 -> perception WAS the bottleneck and
  #     PPO's gradient was destroying it; fix is to protect the
  #     representation (much larger distance_aux_weight, or a lower LR on
  #     the encoder than on the heads) rather than to freeze in production
  #   clear rate stays at 0.696 -> perception is NOT the bottleneck either,
  #     and the constraint is control authority or the task itself
  # Both outcomes redirect the work, which is more than v16-v18 produced.
  # v20: back to false. v19's freeze A/B was run on a BROKEN task -- at
  # dodge_clearance_m 0.02 the bar sat just under the non-collision ceiling,
  # so nothing anywhere asked the policy for a margin, and neither arm of
  # that A/B could have moved. Its conclusion ("perception is not the
  # bottleneck") is therefore not established, and freezing is not carried
  # forward on the strength of it.
  #
  # false restores the intended setup: PPO's reward signal reaches the event
  # encoder, rather than the policy being fit on the state vector alone with
  # a fixed feature bank. Now that the reward actually requires clearing
  # 0.10 m, there is finally a gradient that could make obstacle-localising
  # features worth having.
  #
  # Watch distance_r2 against v19's frozen 0.30. If it collapses to the
  # ~0.10-0.14 that v16-v18 showed while return stalls, then PPO is
  # destroying the representation on the corrected task too, and the answer
  # is to protect it (much larger distance_aux_weight, or a lower LR on the
  # encoder than on the heads) rather than to freeze.
  freeze_extractor_for_ppo: false
  recurrent: false
  lstm_hidden_size: 128
  n_lstm_layers: 2
  # EfficientNet-B0 conv trunk (ImageNet-pretrained, classifier stripped),
  # matching the reference (arXiv 2603.07578). Both random- and
  # oracle-driven pretraining with the small (~26k param) CNN converged to
  # the SAME ~0.10-0.15 R2 ceiling regardless of data source or quantity
  # (random: 400k+ steps; oracle: <5k steps, both plateau there) --
  # ruling out data as the limiting factor. This tests capacity/architecture
  # instead: does a ~150x larger, pretrained trunk move the ceiling?
  event_backbone: efficientnet_b0
  distance_aux_weight: 5.0
  # Supervise the distance decoder ONLY when the obstacle is close enough to
  # produce a usable event signature. The target map runs to
  # DISTANCE_MAX_M = 8 m, but events come from apparent motion and a distant
  # obstacle has low angular rate, so it generates few events however many
  # pixels it nominally covers (2.15 deg = 11 px at 8 m, against a 10 deg
  # bin). Demanding a bin-localised distance from that is close to
  # unlearnable, and MSE weights those frames the same as close ones where
  # the sphere is obvious -- so most of the gradient was noise.
  #
  # Symptom: after 213k steps distance_r2 sat at -1.57, i.e. worse than
  # predicting the mean, despite weight 5.0. Meanwhile success reached 44%,
  # level with a blind 0.5 Hz sine weave (45%), which is what a policy that
  # cannot see would score.
  #
  # 4.0 m is inside the actionable window: at 5 m/s that is 0.8 s to impact
  # against the 0.64 s a 0.30 m dodge needs at 1.5 m/s^2, so nothing the
  # policy could still act on is excluded. Frames with NO obstacle are still
  # supervised -- "report clear" is learnable and needed.
  # Segment the obstacle, do not regress its depth. Depth from a single
  # event time surface is ill-posed -- a near small sphere and a far large
  # one give similar patterns, and only their rate of change separates them
  # -- so the per-frame decoder was being asked for something its input does
  # not determine. That is the likeliest reason distance_r2 sat at -1.57
  # despite weight 5.0. Binary occupancy (WHICH BEARINGS hold an obstacle) is
  # recoverable from one frame and is all this term has to do: force the
  # encoder to localise the obstacle rather than ignore it. Depth, if it is
  # wanted at all, is the recurrent layer's job.
  # Two-phase training, as in the reference (arXiv 2603.07578): the encoder
  # is trained by auxiliary supervision, then the decoder is DISCARDED and the
  # policy trains on the frozen encoder. Occupancy R2 crosses zero by ~18k
  # steps and plateaus near +0.07, so running the aux term for the remaining
  # millions buys nothing.
  #
  # It is also the component retaining ~280 MiB per update: episode length is
  # flat at ~150 steps while allocation climbed 4.0 -> 16.3 GB, so the growth
  # is not BPTT sequence length. Stopping it ends the growth and matches the
  # reference's structure at the same time.
  # 40000 -> 22000. Measured growth with the aux term running is ~0.71 GB
  # per 1000 steps (3.8 GB at 6.6k, 11.1 GB at 16.9k), which reaches the
  # 23 GB card at ~34k steps -- before a 40k shutoff could take effect. R2
  # crosses zero by ~17k and plateaus near +0.06, so 22k is past the useful
  # point with margin and stops the growth at ~15 GB.
  # DISABLED (0). The two-phase stop was introduced for two reasons and both
  # failed:
  #   * "the aux callback is the memory leak" -- disproven. Growth continued
  #     at +282 MiB/update after the aux stopped cleanly at 22016 steps; the
  #     retention is RecurrentPPO-specific and does not exist here (allocation
  #     pinned at 39 MiB, deltas +0).
  #   * "R2 plateaus near +0.07 by 20k steps" -- that was measured on the
  #     RECURRENT runs and carried over without rechecking. In this config
  #     22.5k steps is only TEN aux updates, and R2 was still -0.0391 and
  #     climbing steeply (-0.259 -> -0.0506 -> -0.0391 over the last three).
  #     The encoder was frozen mid-ascent, having never beaten its baseline,
  #     so the policy then trained for 140k steps on features that carry no
  #     obstacle information -- which is why reward sat at the do-nothing
  #     floor.
  # With no memory pressure there is no reason to stop supervising at all.
  distance_aux_stop_after_steps: 0
  distance_aux_occupancy_only: true
  distance_aux_near_range_m: 4.0
  pretanh_penalty: 0.01
  use_sde: true
  # v18: 20 -> 8. STALE PARAMETER, not a design change. The block above tuned
  # this to "~0.4s, half offset_tau_s" -- correct at the 50 Hz policy rate it
  # was set at, where 20 steps IS 0.4 s. policy_decimation later moved
  # decisions to 20 Hz (control_rate 100 / 5, i.e. 50 ms per step) and this
  # was never retuned, so the hold silently became 1.0 s against
  # offset_tau_s=0.8s -- 2.5x the intended value and LONGER than the
  # integrator time constant. That is past the 40-step setting (0.8 s at
  # 50 Hz, exactly tau) which the block above records as rejected for growing
  # a worsening out_of_bounds failure mode.
  #
  # Consequence, measured over v17's 620k steps: authority_used_in_threat sat
  # at 0.152 and never moved (0.157/0.152/0.154/0.146/0.157/0.151 across the
  # run) while authority_free_at_onset stayed at 0.936 -- the policy had 94%
  # of its range available and declined to use it. A 1.0 s hold spans most of
  # a 1-2 s encounter, so exploration can only ever propose "sit displaced",
  # never "move sharply as the obstacle arrives". The one strategy gSDE could
  # sample is precisely the standing-offset exploit w_along_track and
  # w_no_threat_offset exist to punish, so every sample it drew was correctly
  # rejected and the policy shrank toward zero deviation.
  #
  # 8 steps = 0.4 s at 20 Hz, restoring the 0.5 * offset_tau_s the original
  # reasoning intended. NOT shorter: i.i.d.-ward resampling reverts to the
  # leaky-integrator averaging problem the block above measured (~11% of a
  # sustained action's displacement).
  sde_sample_freq: 8
  vf_coef: 0.5
  max_grad_norm: 0.5
  # Was cpu, left over from the earlier tiny-MLP (18-dim state) baseline.
  # Now that the actor runs a CNN over full-resolution (2, 480, 640) event
  # frames, CPU-side conv passes were almost certainly the dominant cost --
  # envs_on_gpu0 was already deliberately kept lower than GPU1's share
  # specifically to leave GPU0 headroom for "policy inference and the PPO
  # update" (see its comment in train_sb3.py), which only makes sense if
  # the model actually runs on GPU0. It didn't; this was silently unused.
  device: cuda:0
vecnormalize:
  normalize_obs: true
  normalize_reward: true
