# F3 backbone shape for `640x480x20_patchff_ds1_small_v1.pth`, verbatim from f3's
# confs/ff/modeloptions/. `model`, `T`, `use_decoder_block` and `variable_mode` are f3
# knobs that nets/f3.py does not read; they stay so the file still matches the checkpoint.
model: EventPatchFF
T: 20
convbtlncks: [2, 2, 2]
convdepths: [2, 2, 2]
convdilations: [1, 1, 1]
convkernels: [5, 5, 5]
dims: [96, 160, 192]
dskernels: [5, 3, 3]
dsstrides: [4, 2, 2]
use_upsampling: true
upsampling_dims: 16
frame_sizes: [640, 480, 20]
multi_hash_encoder:
  coarsest_resolution: [8, 8, 1]
  feature_size: 2
  finest_resolution: [320, 180, 8]
  levels: 4
  log2_entries_per_level: 19
patch_size: 1
use_decoder_block: false
variable_mode: true

# Receptive field 289x289, feature downsample 1x1, 1.3 M params, 14 ms on orin for VGA at 200k events.
