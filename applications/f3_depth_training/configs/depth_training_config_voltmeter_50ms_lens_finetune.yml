# Fine-tunes the 50 ms mixed model on pinhole and calib 40 deg lens episodes, so it learns
# the lens without forgetting the pinhole. Run with --init <run>/models/last.pth --retrain-f3.

# Which validation drives the metrics and checkpoint selection.
validation:
  source: m3ed # 'simulator' or 'm3ed'
  track_best: [SSIMAELoss, d1, abs_rel]

# Training options
finetune: true # one lr for every parameter
lr: 2.5e-6 # Peak learning rate
warmup_epochs: 5 # Linear ramp up to lr; 0 disables
cooldown_epochs: 20 # Cosine anneal to lr/1000 over the final epochs; 0 disables
clip_grad: 0 # Gradient clipping (0 = disabled)
epochs: 60 # Number of epochs
log_interval: 5 # Save checkpoint interval in epochs
val_interval: 5 # Validation interval in epochs

# Event options
polarity: [False, False] # [use_polarity_ctx, use_polarity_pred]

# Training data options
train:
  batch: 32 # Effective batch size (accumulates 4 x mini_batch)
  mini_batch: 8 # Mini batch size per forward pass

# Loss options
loss: ssimae # Loss function: 'ssimae', 'silog', 'siloggrad'
scales: 4 # Number of scales for gradient matching loss
alpha: 0.5 # Weight for gradient matching loss, the MiDaS value
min_disparity: 0.05 # Minimum disparity for max depth 20.0 m
max_disparity: 1000.0 # Maximum disparity for min depth 0.001 m

# DepthAnythingV2 config
dav2_config:
  size: 308 # Input size for DAv2
  encoder: vitb # Encoder type: 'vits', 'vitb', 'vitl'
  head: exp # 'relu' emits disparity, 'exp' a log disparity that cannot overflow
  ckpt: applications/f3_depth_training/models/depth_anything_v2_vitb.pth # Path to DAv2 checkpoint

# EventFF (F3) config - the feature backbone; --init loads the trained weights over both
eventff:
  config: applications/f3_depth_training/configs/f3_640x480x50_small_temporal.yml
  ckpt: applications/f3_depth_training/models/640x480x20_patchff_ds1_small_v1_uncompiled.pth # Path to EventFF weights

# Online data pipeline settings.
# `online_data` is the same block OnlineDataLoader.from_config(...) reads everywhere
# (roles + scenes/DR + loader knobs); `trainer_gpu`/`color_sensor`/`sim_time`/
# `event_time_window_us` are training-only siblings.
data:
  trainer_gpu: 1 # trainer GPU (producers run on online_data.gpu_ids)
  min_events_per_sample: 500 # drop sparser samples before they reach a batch
  max_events_per_sample: 800000 # thin a sample to this many events; 0 disables
  min_valid_depth_frac: 0.70 # fraction of the depth frame that must be valid to train on it

  # Recorded M3ED flights scored against LiDAR
  m3ed:
    stride: 4 # every Nth LiDAR frame; 561 per sequence at 10 Hz, and adjacent ones agree
    min_coverage: 0.01 # skip a frame under this fraction of valid LiDAR pixels
    batch: 8
    num_workers: 4 # h5 reads and cropping run ahead of the GPU
    sequences:
      - data/m3ed/falcon_indoor_flight_1
      - data/m3ed/falcon_indoor_flight_2
      - data/m3ed/falcon_indoor_flight_3

  online_data:
    base_settings: configs/depth-training-voltmeter-50ms-settings.yaml # sensors, dynamics, controller, trajectory
    num_producers: 8 # 8 simulators ...
    gpu_ids: [0] # ... all on gpu0
    base_seed: 0
    bus_maxsize: 2048 # backpressure bound
    roles:
      anchor: [depth_camera_1] # depth tick defines the sample boundary
      stream: [event_camera_1] # events accumulate within each depth window
    randomization:
      resample_every: 1 # reload scene+sensors every N episodes; trajectory every episode
      scenes_glob:
        data/hm3d/*/*.basis.glb: 0.55
        data/scenesmith-uastc/Room/*.glb: 0.20
        data/scenesmith-uastc/House/*.glb: 0.25
      visual_backend:
        agent_height: {range: [0.75, 1.5]} # camera height above the floor, not flight height
      sensors:
        # DVS-Voltmeter has no contrast threshold; k1..k6 are the calibrated
        # process parameters
        event_camera_1:
          leak_scale: 1.0
          k:
            - {range: [4.739, 5.792]} # k1, the rate knob
            - {range: [17.0, 23.0]} # k2, spanning both camera presets
            - 1.0e-4 # k3
            - {range: [3.0e-8, 3.0e-7]} # k4 thermal leak, 0.04-0.30 ev/px/s, ON only
            - {range: [0.0, 5.0e-9]} # k5 photocurrent leak, adds 0-0.50 at L=80, ON only
            - {range: [1.0e-5, 1.2e-3]} # k6 noise floor, 0.10-1.55 ev/px/s
        # One shared draw per episode, so both frusta match: either the pinhole cameras
        # the model trained on, or the calib 40 deg lens with a little randomization.
        "event_camera_1,depth_camera_1":
          choices:
            - hfov: {range: [50, 65]}
              position: [0.0, {range: [-0.1, 0.1]}, 0.0]
            - hfov: {range: [47, 51]}
              position: [0.0, {range: [-0.1, 0.1]}, 0.0]
              principal_point: [{range: [283, 303]}, {range: [221, 241]}]
              distortion: [-0.5721, 0.2233, -0.0025, 0.0066, 0.0]
              distortion_scale: {range: [0.9, 1.1]}
      trajectory:
        v_avg: {range: [0.2, 1.5]}
        hovers: {choices: [0, 1, 2, 3]} # a count, so `choices`; `range` samples a float
        hover_s: {range: [0.5, 1.5]}
